$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://ai-factory.example/schemas/dataset-recipe-v1"
title: AI Factory dataset recipe
type: object
required:
  - schema_version
  - kind
  - dataset_id
  - generator
  - output
properties:
  schema_version:
    const: 1
  kind:
    type: string
    minLength: 1
  dataset_id:
    type: string
    pattern: "^[a-z0-9]+(?:_[a-z0-9]+)*(?:__[a-z0-9]+(?:_[a-z0-9]+)*)*$"
  generator:
    type: string
    pattern: "^catalog/.+/generator\\.cpp$"
  row_count:
    type: integer
    minimum: 1
  candidate_row_count:
    type: integer
    minimum: 1
  random_number_generator:
    const: philox
  exercise_replay:
    enum:
      - frozen_exercise_time
      - frozen_regression_policy
  sensitivity_strategy:
    enum: [mono, node_graph]
  output:
    type: object
    required: [path, format]
    properties:
      path:
        type: string
        pattern: "^datasets/.+\\.json$"
      format:
        enum: [json, parquet]
    additionalProperties: false
  generation_details: false
  generation_output: false
  url: false
  option_side:
    enum: [call, put, payer, receiver]
oneOf:
  - required: [row_count]
  - required: [candidate_row_count, row_selection]
allOf:
  - not:
      anyOf:
        - required: [rng_mapping_version]
        - required: [launch_profile]
        - required: [sensitivity_execution]
additionalProperties: true
