schema_version: 1
kind: curve_parameters
dataset_id: svensson_01
generator: catalog/parameters/curve/svensson/svensson_01/generator.cpp
output:
  path: datasets/parameters/curve/svensson/svensson_01.json
  format: json
curve_family: Svensson
row_count: 1000
parameters:
  beta0: Long-maturity continuously compounded rate.
  beta1: Short-end slope loading.
  beta2: First medium-term curvature loading.
  beta3: Second medium-term curvature loading.
  tau1: Positive first decay time in years.
  tau2: Positive second decay time in years.
construction:
  method: forward-level reconstruction with rejection
  sampled_factors:
    long_forward:
      definition: f(0, infinity)
      uniform_bounds:
      - 0.005
      - 0.06
    short_forward:
      definition: f(0, 0)
      uniform_bounds:
      - 0.001
      - 0.08
    first_medium_forward:
      definition: f(0, tau1)
      uniform_bounds:
      - 0.001
      - 0.08
    second_medium_forward:
      definition: f(0, tau2)
      uniform_bounds:
      - 0.001
      - 0.08
    tau1:
      definition: first decay time in years
      uniform_bounds:
      - 0.5
      - 3.0
    tau2:
      definition: second decay time in years
      uniform_bounds:
      - 4.0
      - 12.0
  acceptance_rule:
    forward_bounds:
    - 0.001
    - 0.1
    curvature_bounds:
    - -0.2
    - 0.2
    condition: bounds checked from zero to the converged tail
