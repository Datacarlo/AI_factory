schema_version: 1
kind: curve_parameters
dataset_id: nelson_siegel_01
generator: catalog/parameters/curve/nelson_siegel/nelson_siegel_01/generator.cpp
output:
  path: datasets/parameters/curve/nelson_siegel/nelson_siegel_01.json
  format: json
curve_family: Nelson-Siegel
row_count: 1000
parameters:
  beta0: Long-maturity continuously compounded rate.
  beta1: Short-end slope loading.
  beta2: Medium-term curvature loading.
  tau: Positive decay time in years.
construction:
  method: forward-level reconstruction with rejection
  sampled_factors:
    long_forward:
      definition: f(0, infinity)
      uniform_bounds:
      - 0.005
      - 0.06
    short_forward:
      definition: f(0, 0)
      uniform_bounds:
      - 0.001
      - 0.08
    medium_forward:
      definition: f(0, tau)
      uniform_bounds:
      - 0.001
      - 0.08
    tau:
      definition: decay time in years
      uniform_bounds:
      - 0.5
      - 5.0
  reconstruction:
    beta0: long_forward
    beta1: short_forward - long_forward
    beta2: e * (medium_forward - long_forward) - beta1
  acceptance_rule:
    forward_bounds:
    - 0.001
    - 0.1
    condition: bounds apply to f(0,T) for every T >= 0
    extremum: T / tau = 1 - beta1 / beta2 when positive
