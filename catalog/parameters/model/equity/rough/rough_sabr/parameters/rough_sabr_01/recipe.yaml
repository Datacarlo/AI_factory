schema_version: 1
kind: model_parameters
dataset_id: rough_sabr_01
generator: catalog/parameters/model/equity/rough/rough_sabr/parameters/rough_sabr_01/generator.cpp
output:
  path: datasets/parameters/model/equity/rough/rough_sabr/parameters/rough_sabr_01.json
  format: json
model_family: rough SABR
row_count: 1000
parameters:
  spot: Initial spot, sampled between S0_min and S0_max.
  risk_free_rate: Continuously compounded risk-free rate.
  dividend_yield: Continuously compounded dividend yield.
  xi_0: Flat initial squared-volatility level, independently sampled per row.
  eta: Volatility of the logarithmic squared volatility.
  hurst_exponent: Roughness exponent H, strictly between 0 and 0.5.
  rho: Spot/rough-driver Brownian correlation.
  beta: CEV elasticity, between 0.5 and 1.
dynamics:
  rough_driver: Y_t = sqrt(2H) integral_0^t (t-s)^(H-1/2) dW_s.
  volatility: alpha_t = sqrt(xi_0) S0^(1-beta) exp(eta Y_t / 2 - eta^2 t^(2H) / 4).
  spot: dS_t = (r-q) S_t dt + alpha_t S_t^beta dZ_t.
  correlation: d<Z,W>_t = rho dt.
  simulation: Hybrid rough convolution followed by Lamperti spot steps.
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: independent uniform sample
      bounds:
        xi_0:
        - 0.01
        - 0.09
        spot:
        - 0.25
        - 4.0
        risk_free_rate:
        - 0.001
        - 0.08
        dividend_yield:
        - 0.0
        - 0.06
        eta:
        - 0.5
        - 3.0
        hurst_exponent:
        - 0.03
        - 0.25
        rho:
        - -0.95
        - -0.3
        beta:
        - 0.7
        - 1.0
  stress:
    row_count: 100
    generation:
      method: independent uniform sample
      bounds:
        xi_0:
        - 0.005
        - 0.12
        spot:
        - 0.2
        - 5.0
        risk_free_rate:
        - -0.03
        - 0.12
        dividend_yield:
        - 0.0
        - 0.1
        eta:
        - 0.25
        - 3.5
        hurst_exponent:
        - 0.02
        - 0.35
        rho:
        - -0.98
        - -0.1
        beta:
        - 0.6
        - 1.0
  fixed_parameters:
    forward_variance_curve: xi_0(t) = xi_0 for all t
  spot_range:
    S0_min: 0.20000000298023224
    S0_max: 5.0
  parameterization:
    initial_log_return_volatility: sqrt(xi_0)
    dimensional_alpha_0: sqrt(xi_0)*S0^(1-beta)
  rough_driver_discretization:
    scheme: Bennedsen-Lunde-Pakkanen hybrid scheme
    kappa: 1
    far_cell_evaluation: L2-optimal b_k^*
