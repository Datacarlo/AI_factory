schema_version: 1
kind: model_parameters
dataset_id: rough_stein_stein_01
generator: catalog/parameters/model/equity/rough/rough_stein_stein/parameters/rough_stein_stein_01/generator.cpp
output:
  path: datasets/parameters/model/equity/rough/rough_stein_stein/parameters/rough_stein_stein_01.json
  format: json
model_family: rough Stein-Stein
row_count: 1000
parameters:
  spot: Initial spot; fixed to 1.
  risk_free_rate: Continuously compounded risk-free rate.
  dividend_yield: Continuously compounded dividend yield.
  volatility_level: Constant mean arithmetic volatility.
  mean_reversion: Linear Volterra mean-reversion rate.
  volatility_of_volatility: Gaussian Volterra scale.
  hurst_exponent: Fractional roughness H.
  rho: Spot/volatility Brownian correlation.
dynamics:
  volatility: X=theta-kappa K*(X-theta)dt+nu K*dW.
  spot: dS/S=(r-q)dt+X dB.
  simulation: Linear resolvent followed by one hybrid FFT.
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: independent uniform sample
      bounds:
        risk_free_rate:
        - 0.001
        - 0.08
        dividend_yield:
        - 0.0
        - 0.06
        volatility_level:
        - 0.1
        - 0.35
        mean_reversion:
        - 0.2
        - 4.0
        volatility_of_volatility:
        - 0.05
        - 0.5
        hurst_exponent:
        - 0.03
        - 0.25
        rho:
        - -0.9
        - -0.1
  stress:
    row_count: 100
    generation:
      method: independent uniform sample
      bounds:
        risk_free_rate:
        - -0.03
        - 0.12
        dividend_yield:
        - 0.0
        - 0.1
        volatility_level:
        - 0.02
        - 0.6
        mean_reversion:
        - 0.1
        - 6.0
        volatility_of_volatility:
        - 0.02
        - 0.8
        hurst_exponent:
        - 0.02
        - 0.35
        rho:
        - -0.98
        - -0.05
