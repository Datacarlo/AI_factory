schema_version: 1
kind: model_parameters
dataset_id: rough_heston_01
generator: catalog/parameters/model/equity/rough/rough_heston/parameters/rough_heston_01/generator.cpp
output:
  path: datasets/parameters/model/equity/rough/rough_heston/parameters/rough_heston_01.json
  format: json
model_family: rough Heston
row_count: 1000
parameters:
  spot: Initial spot; fixed to 1 in this dataset.
  risk_free_rate: Continuously compounded risk-free rate.
  dividend_yield: Continuously compounded dividend yield.
  initial_variance: Initial instantaneous variance V0.
  mean_reversion: Linear variance mean-reversion coefficient.
  variance_drift: Constant variance drift theta; implied long-run variance is theta/lambda.
  volatility_of_variance: Variance diffusion coefficient nu.
  hurst_exponent: Roughness exponent H, strictly between 0 and 0.5.
  rho: Spot/variance-driver Brownian correlation.
dynamics:
  spot: dS_t / S_t = (r-q) dt + sqrt(V_t) dZ_t.
  variance: V_t = V0 + integral_0^t K_H(t-s) [(theta-lambda V_s) ds + nu sqrt(V_s)
    dW_s].
  kernel: K_H(u) = u^(H-1/2) / Gamma(H+1/2).
  correlation: d<Z,W>_t = rho dt.
  simulation: Positive exponential N-factor approximation of the Volterra kernel.
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: independent uniform sample
      bounds:
        spot:
        - 1.0
        - 1.0
        risk_free_rate:
        - 0.001
        - 0.08
        dividend_yield:
        - 0.0
        - 0.06
        initial_variance:
        - 0.01
        - 0.12
        mean_reversion:
        - 0.5
        - 4.0
        long_run_variance:
        - 0.01
        - 0.15
        hurst_exponent:
        - 0.03
        - 0.25
        rho:
        - -0.95
        - -0.25
      conditional_reconstruction:
        variance_drift: mean_reversion * sampled long_run_variance
        implied_long_run_variance: variance_drift / mean_reversion
        volatility_of_variance:
          minimum: max(sqrt(variance_drift / 5.000000), 0.080000)
          maximum: min(sqrt(12.000000 * variance_drift), 0.800000)
          distribution: uniform conditional on reconstructed variance_drift
  stress:
    row_count: 100
    generation:
      method: independent uniform sample
      bounds:
        spot:
        - 1.0
        - 1.0
        risk_free_rate:
        - -0.03
        - 0.12
        dividend_yield:
        - 0.0
        - 0.1
        initial_variance:
        - 0.0075
        - 0.2
        mean_reversion:
        - 0.3
        - 5.0
        long_run_variance:
        - 0.0075
        - 0.22
        hurst_exponent:
        - 0.02
        - 0.35
        rho:
        - -0.98
        - -0.1
      conditional_reconstruction:
        variance_drift: mean_reversion * sampled long_run_variance
        implied_long_run_variance: variance_drift / mean_reversion
        volatility_of_variance:
          minimum: max(sqrt(variance_drift / 5.000000), 0.080000)
          maximum: min(sqrt(12.000000 * variance_drift), 0.800000)
          distribution: uniform conditional on reconstructed variance_drift
  variance_parameterization:
    equation: theta is variance_drift in theta - mean_reversion * V_t
    reason: sample a readable long-run variance, then store production coefficients
  rough_kernel:
    formula: K_H(u) = u^(H-1/2) / Gamma(H+1/2)
    production_scheme: positive exponential N-factor Markovian lift
