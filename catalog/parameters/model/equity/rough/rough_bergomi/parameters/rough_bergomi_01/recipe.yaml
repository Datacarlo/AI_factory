schema_version: 1
kind: model_parameters
dataset_id: rough_bergomi_01
generator: catalog/parameters/model/equity/rough/rough_bergomi/parameters/rough_bergomi_01/generator.cpp
output:
  path: datasets/parameters/model/equity/rough/rough_bergomi/parameters/rough_bergomi_01.json
  format: json
model_family: rough Bergomi
row_count: 1000
parameters:
  spot: Initial spot; fixed to 1 in this dataset.
  risk_free_rate: Continuously compounded risk-free rate.
  dividend_yield: Continuously compounded dividend yield.
  xi_0: Flat forward variance level, independently sampled per row.
  eta: Volatility of the logarithmic variance.
  hurst_exponent: Roughness exponent H, strictly between 0 and 0.5.
  rho: Spot/rough-driver Brownian correlation.
dynamics:
  spot: dS_t / S_t = (r-q) dt + sqrt(v_t) dZ_t.
  variance: v_t = xi_0 exp(eta Y_t - eta^2 t^(2H) / 2).
  rough_driver: Y_t = sqrt(2H) integral_0^t (t-s)^(H-1/2) dW_s.
  correlation: d<Z,W>_t = rho dt.
  simulation: Hybrid scheme with kappa=1 and optimal far-cell weights.
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: independent uniform sample
      bounds:
        xi_0:
        - 0.01
        - 0.09
        risk_free_rate:
        - 0.001
        - 0.08
        dividend_yield:
        - 0.0
        - 0.06
        eta:
        - 0.5
        - 3.0
        hurst_exponent:
        - 0.03
        - 0.25
        rho:
        - -0.95
        - -0.3
  stress:
    row_count: 100
    generation:
      method: independent uniform sample
      bounds:
        xi_0:
        - 0.005
        - 0.12
        risk_free_rate:
        - 0.0001
        - 0.12
        dividend_yield:
        - 0.0
        - 0.1
        eta:
        - 0.25
        - 3.5
        hurst_exponent:
        - 0.02
        - 0.35
        rho:
        - -0.98
        - -0.15
  fixed_parameters:
    spot: 1.0
    forward_variance_curve: xi_0(t) = xi_0 for all t
  aligned_mc_domain:
    rho: strictly negative spot/rough-driver correlation in core and stress rows
    stress_eta: at most 4.0 for aligned Monte Carlo references
  rough_driver_discretization:
    scheme: Bennedsen-Lunde-Pakkanen hybrid scheme
    kappa: 1
    far_cell_evaluation: L2-optimal b_k^*
