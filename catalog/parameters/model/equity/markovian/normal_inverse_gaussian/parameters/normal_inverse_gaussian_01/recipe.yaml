schema_version: 1
kind: model_parameters
dataset_id: normal_inverse_gaussian_01
generator: catalog/parameters/model/equity/markovian/normal_inverse_gaussian/parameters/normal_inverse_gaussian_01/generator.cpp
output:
  path: datasets/parameters/model/equity/markovian/normal_inverse_gaussian/parameters/normal_inverse_gaussian_01.json
  format: json
model_family: Normal-Inverse-Gaussian
row_count: 1000
parameters:
  spot: Initial spot.
  risk_free_rate: Continuously compounded risk-free rate.
  dividend_yield: Continuously compounded dividend yield.
  alpha: Positive NIG tail-steepness parameter.
  beta: NIG asymmetry parameter with abs(beta) < alpha.
  delta: Positive NIG scale parameter per year.
dynamics:
  log_return: X_t = beta * G_t + W_(G_t)
  inverse_gaussian_clock: G_t ~ IG(delta*t/gamma, (delta*t)^2), gamma=sqrt(alpha^2-beta^2)
  martingale_correction: omega = delta * (sqrt(alpha^2-(beta+1)^2) - gamma)
  spot: S_t = S_0 exp((r-q+omega)t + X_t)
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: latent uniform sample, reconstruction, and rejection
      latent_uniform_bounds:
        risk_free_rate:
        - 0.0010000000474974513
        - 0.07999999821186066
        dividend_yield:
        - 0.0
        - 0.05999999865889549
        alpha:
        - 4.0
        - 25.0
        skew_ratio_beta_over_alpha:
        - -0.75
        - 0.05000000074505806
        target_annual_volatility:
        - 0.10000000149011612
        - 0.550000011920929
      reconstruction:
        beta: skew_ratio_beta_over_alpha * alpha
        gamma: sqrt(alpha^2 - beta^2)
        delta: target_annual_volatility^2 * gamma^3 / alpha^2
      acceptance_condition: alpha > max(abs(beta + 1), abs(beta + 2)) + 0.05
      rejected_proposals: 0
      purpose: guarantee the first two exponential moments and sample volatility on
        an interpretable scale
  stress:
    row_count: 100
    generation:
      method: latent uniform sample, reconstruction, and rejection
      latent_uniform_bounds:
        risk_free_rate:
        - -0.029999999329447746
        - 0.11999999731779099
        dividend_yield:
        - 0.0
        - 0.10000000149011612
        alpha:
        - 3.0
        - 30.0
        skew_ratio_beta_over_alpha:
        - -0.800000011920929
        - 0.25
        target_annual_volatility:
        - 0.05999999865889549
        - 0.699999988079071
      reconstruction:
        beta: skew_ratio_beta_over_alpha * alpha
        gamma: sqrt(alpha^2 - beta^2)
        delta: target_annual_volatility^2 * gamma^3 / alpha^2
      acceptance_condition: alpha > max(abs(beta + 1), abs(beta + 2)) + 0.05
      rejected_proposals: 0
      purpose: guarantee the first two exponential moments and sample volatility on
        an interpretable scale
