schema_version: 1
kind: model_parameters
dataset_id: stein_stein_01
generator: catalog/parameters/model/equity/markovian/stein_stein/parameters/stein_stein_01/generator.cpp
output:
  path: datasets/parameters/model/equity/markovian/stein_stein/parameters/stein_stein_01.json
  format: json
model_family: Stein-Stein
row_count: 1000
parameters:
  spot: Initial spot; fixed to 1.
  risk_free_rate: Continuously compounded risk-free rate.
  dividend_yield: Continuously compounded dividend yield.
  initial_volatility: Initial arithmetic volatility.
  mean_reversion: Zero-mean OU rate.
  volatility_of_volatility: OU diffusion coefficient.
  rho: Spot/volatility Brownian correlation, sampled per row.
dynamics:
  spot: dS/S=(r-q)dt+X dW_S.
  volatility: dX=-kappa X dt+nu dW_X.
  correlation: d<W_S,W_X>_t = rho dt.
  simulation: Exact OU endpoint coupled to the Euler stock increment.
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: independent uniform sample
      bounds:
        risk_free_rate:
        - 0.001
        - 0.08
        dividend_yield:
        - 0.0
        - 0.06
        initial_volatility:
        - 0.1
        - 0.35
        mean_reversion:
        - 0.5
        - 8.0
        volatility_of_volatility:
        - 0.05
        - 0.5
        rho:
        - -0.75
        - -0.1
  stress:
    row_count: 100
    generation:
      method: independent uniform sample
      bounds:
        risk_free_rate:
        - -0.03
        - 0.12
        dividend_yield:
        - 0.0
        - 0.1
        initial_volatility:
        - 0.02
        - 0.6
        mean_reversion:
        - 0.2
        - 12.0
        volatility_of_volatility:
        - 0.02
        - 0.8
        rho:
        - -0.9
        - -0.05
  fixed_parameters:
    spot: 1.0
  aligned_mc_domain:
    rho: negative spot/volatility correlation in core and stress rows
