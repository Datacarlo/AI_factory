schema_version: 1
kind: model_parameters
dataset_id: sabr_01
generator: catalog/parameters/model/equity/markovian/sabr/parameters/sabr_01/generator.cpp
output:
  path: datasets/parameters/model/equity/markovian/sabr/parameters/sabr_01.json
  format: json
model_family: SABR equity
row_count: 1000
parameters:
  spot: Initial equity spot, sampled between S0_min and S0_max.
  risk_free_rate: Continuously compounded risk-free rate.
  dividend_yield: Continuously compounded dividend yield.
  initial_volatility: Initial log-return volatility at S0.
  volatility_of_volatility: Lognormal alpha volatility.
  rho: Spot/alpha Brownian correlation.
  beta: CEV elasticity.
dynamics:
  spot: dS_t=(r-q)S_t dt+alpha_t S_t^beta dW_t.
  alpha: dalpha_t=nu alpha_t dZ_t.
  correlation: d<W,Z>_t=rho dt.
  simulation: Lamperti step for S and exact lognormal alpha endpoint.
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: independent uniform sample
      bounds:
        spot:
        - 0.25
        - 4.0
        risk_free_rate:
        - 0.001
        - 0.08
        dividend_yield:
        - 0.0
        - 0.06
        initial_volatility:
        - 0.08
        - 0.5
        volatility_of_volatility:
        - 0.1
        - 1.5
        rho:
        - -0.9
        - -0.2
        beta:
        - 0.5
        - 0.95
  stress:
    row_count: 100
    generation:
      method: independent uniform sample
      bounds:
        spot:
        - 0.2
        - 5.0
        risk_free_rate:
        - -0.03
        - 0.12
        dividend_yield:
        - 0.0
        - 0.1
        initial_volatility:
        - 0.04
        - 0.55
        volatility_of_volatility:
        - 0.08
        - 1.8
        rho:
        - -0.98
        - -0.1
        beta:
        - 0.4
        - 0.95
  aligned_mc_domain:
    rho: negative spot/alpha correlation for the aligned price reference campaign
    beta: CEV elasticity at least 0.50 in core and 0.40 in stress, away from the absorption-sensitive
      beta-near-zero regime
    stress_volatility: initial volatility at most 0.55 and lognormal alpha volatility
      at most 1.80
  spot_range:
    S0_min: 0.20000000298023224
    S0_max: 5.0
  parameterization:
    initial_volatility: initial log-return volatility sigma_0
    dimensional_alpha: alpha_0=sigma_0*S0^(1-beta)
