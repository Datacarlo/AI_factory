schema_version: 1
kind: model_parameters
dataset_id: bates_01
generator: catalog/parameters/model/equity/markovian/bates/parameters/bates_01/generator.cpp
output:
  path: datasets/parameters/model/equity/markovian/bates/parameters/bates_01.json
  format: json
model_family: Bates
row_count: 1000
parameters:
  spot: Initial spot.
  risk_free_rate: Continuously compounded risk-free rate.
  dividend_yield: Continuously compounded dividend yield.
  initial_variance: Initial variance v0.
  kappa: Variance mean-reversion speed.
  theta: Long-run variance.
  gamma: Volatility of variance.
  rho: Spot/variance Brownian correlation.
  jump_intensity: Poisson jump intensity lambda per year.
  jump_log_mean: Mean nu of the log jump size.
  jump_log_volatility: Standard deviation delta of the log jump size.
dynamics:
  spot: dS_t / S_(t-) = (r - q - lambda * k_J) dt + sqrt(V_t) dW_t^S + (Y - 1) dN_t
  variance: dV_t = kappa (theta - V_t) dt + gamma sqrt(V_t) dW_t^V
  correlation: d<W^S, W^V>_t = rho dt
  jump_size: log(Y) ~ Normal(nu, delta^2)
  compensator: k_J = exp(nu + delta^2 / 2) - 1
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: independent uniform sample
      bounds:
        spot:
        - 1.0
        - 1.0
        risk_free_rate:
        - 0.001
        - 0.08
        dividend_yield:
        - 0.0
        - 0.06
        initial_variance:
        - 0.01
        - 0.12
        kappa:
        - 0.5
        - 4.0
        theta:
        - 0.01
        - 0.15
        rho:
        - -0.95
        - -0.25
        jump_intensity:
        - 0.02
        - 1.0
        jump_log_mean:
        - -0.25
        - 0.05
        jump_log_volatility:
        - 0.05
        - 0.35
      conditional_sampling:
        gamma:
          minimum: max(sqrt(kappa * theta / 5), 0.1)
          maximum: min(sqrt(12 * kappa * theta), 0.8)
          distribution: uniform conditional on kappa and theta
  stress:
    row_count: 100
    generation:
      method: independent uniform sample
      bounds:
        spot:
        - 1.0
        - 1.0
        risk_free_rate:
        - -0.03
        - 0.12
        dividend_yield:
        - 0.0
        - 0.1
        initial_variance:
        - 0.0075
        - 0.2
        kappa:
        - 0.3
        - 5.0
        theta:
        - 0.0075
        - 0.2
        rho:
        - -0.98
        - -0.1
        jump_intensity:
        - 0.02
        - 1.7
        jump_log_mean:
        - -0.35
        - 0.08
        jump_log_volatility:
        - 0.05
        - 0.45
      conditional_sampling:
        gamma:
          minimum: max(sqrt(kappa * theta / 5), 0.1)
          maximum: min(sqrt(12 * kappa * theta), 0.8)
          distribution: uniform conditional on kappa and theta
  jump_convention:
    law: log(Y) ~ Normal(jump_log_mean, jump_log_volatility^2)
    count: N(dt) ~ Poisson(jump_intensity * dt)
    martingale_compensator: jump_intensity * (E[Y] - 1)
