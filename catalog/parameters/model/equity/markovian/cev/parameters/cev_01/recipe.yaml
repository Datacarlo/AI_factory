schema_version: 1
kind: model_parameters
dataset_id: cev_01
generator: catalog/parameters/model/equity/markovian/cev/parameters/cev_01/generator.cpp
output:
  path: datasets/parameters/model/equity/markovian/cev/parameters/cev_01.json
  format: json
model_family: CEV
row_count: 1000
parameters:
  spot: Initial spot, independently sampled per row.
  risk_free_rate: Continuously compounded risk-free rate.
  dividend_yield: Continuously compounded dividend yield.
  sigma: Local-volatility scale.
  beta: CEV elasticity in [0.5, 1).
dynamics:
  sde: dS = (r-q) S dt + sigma S^beta dW.
  simulation: Milstein time stepping with absorption at zero.
  boundary: Negative numerical proposals are projected to the attainable absorbing
    boundary.
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: independent uniform sample
      bounds:
        spot:
        - 0.25
        - 4.0
        risk_free_rate:
        - 0.001
        - 0.08
        dividend_yield:
        - 0.0
        - 0.06
        sigma:
        - 0.08
        - 0.45
        beta:
        - 0.55
        - 0.95
  stress:
    row_count: 100
    generation:
      method: independent uniform sample
      bounds:
        spot:
        - 0.2
        - 5.0
        risk_free_rate:
        - -0.03
        - 0.12
        dividend_yield:
        - 0.0
        - 0.1
        sigma:
        - 0.04
        - 0.6
        beta:
        - 0.5
        - 0.98
