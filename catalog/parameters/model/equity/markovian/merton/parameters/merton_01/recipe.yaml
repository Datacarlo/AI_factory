schema_version: 1
kind: model_parameters
dataset_id: merton_01
generator: catalog/parameters/model/equity/markovian/merton/parameters/merton_01/generator.cpp
output:
  path: datasets/parameters/model/equity/markovian/merton/parameters/merton_01.json
  format: json
model_family: Merton jump diffusion
row_count: 1000
parameters:
  spot: Initial spot.
  risk_free_rate: Continuously compounded risk-free rate.
  dividend_yield: Continuously compounded dividend yield.
  volatility: Diffusion volatility.
  jump_intensity: Poisson jump intensity.
  jump_log_mean: Mean log jump size.
  jump_log_volatility: Log jump-size volatility.
dynamics:
  log_spot: Brownian diffusion plus compound-Poisson normal jumps.
  martingale_correction: lambda * (exp(mu_J + delta_J^2/2) - 1).
  simulation: Exact independent increments; normal jumps aggregated conditionally
    on their Poisson count.
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: independent uniform sample
      bounds:
        risk_free_rate:
        - 0.001
        - 0.08
        dividend_yield:
        - 0.0
        - 0.06
        volatility:
        - 0.08
        - 0.45
        jump_intensity:
        - 0.02
        - 1.0
        jump_log_mean:
        - -0.2
        - 0.08
        jump_log_volatility:
        - 0.03
        - 0.3
  stress:
    row_count: 100
    generation:
      method: independent uniform sample
      bounds:
        risk_free_rate:
        - -0.03
        - 0.12
        dividend_yield:
        - 0.0
        - 0.1
        volatility:
        - 0.04
        - 0.6
        jump_intensity:
        - 0.01
        - 1.8
        jump_log_mean:
        - -0.35
        - 0.15
        jump_log_volatility:
        - 0.02
        - 0.45
