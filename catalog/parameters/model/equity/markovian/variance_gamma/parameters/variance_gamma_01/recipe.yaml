schema_version: 1
kind: model_parameters
dataset_id: variance_gamma_01
generator: catalog/parameters/model/equity/markovian/variance_gamma/parameters/variance_gamma_01/generator.cpp
output:
  path: datasets/parameters/model/equity/markovian/variance_gamma/parameters/variance_gamma_01.json
  format: json
model_family: Variance-Gamma
row_count: 1000
parameters:
  spot: Initial spot.
  risk_free_rate: Continuously compounded risk-free rate.
  dividend_yield: Continuously compounded dividend yield.
  sigma: Brownian volatility in business time.
  nu: Variance rate of the unit-mean Gamma clock.
  theta: Drift of Brownian motion in business time.
dynamics:
  log_return: X_t = theta * G_t + sigma * W_(G_t)
  gamma_clock: G_t ~ Gamma(shape=t/nu, scale=nu)
  martingale_correction: omega = log(1 - theta*nu - sigma^2*nu/2) / nu
  spot: S_t = S_0 exp((r-q+omega)t + X_t)
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: independent uniform proposals with rejection
      proposal_bounds:
        spot:
        - 1.0
        - 1.0
        risk_free_rate:
        - 0.0010000000474974513
        - 0.07999999821186066
        dividend_yield:
        - 0.0
        - 0.05999999865889549
        sigma:
        - 0.07999999821186066
        - 0.44999998807907104
        nu:
        - 0.029999999329447746
        - 0.5
        theta:
        - -0.3499999940395355
        - 0.15000000596046448
      acceptance_condition: 1 - theta*nu - 0.5*sigma^2*nu > 0.05 and 1 - 2*theta*nu
        - 2*sigma^2*nu > 0.05
      rejected_proposals: 0
      purpose: guarantee both the martingale moment and a finite payoff variance for
        Monte Carlo validation
  stress:
    row_count: 100
    generation:
      method: independent uniform proposals with rejection
      proposal_bounds:
        spot:
        - 1.0
        - 1.0
        risk_free_rate:
        - -0.029999999329447746
        - 0.11999999731779099
        dividend_yield:
        - 0.0
        - 0.10000000149011612
        sigma:
        - 0.03999999910593033
        - 0.6499999761581421
        nu:
        - 0.05000000074505806
        - 0.800000011920929
        theta:
        - -0.5
        - 0.3499999940395355
      acceptance_condition: 1 - theta*nu - 0.5*sigma^2*nu > 0.05 and 1 - 2*theta*nu
        - 2*sigma^2*nu > 0.05
      rejected_proposals: 0
      purpose: guarantee both the martingale moment and a finite payoff variance for
        Monte Carlo validation
