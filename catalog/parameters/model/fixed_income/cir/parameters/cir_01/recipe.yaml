schema_version: 1
kind: model_parameters
dataset_id: cir_01
generator: catalog/parameters/model/fixed_income/cir/parameters/cir_01/generator.cpp
output:
  path: datasets/parameters/model/fixed_income/cir/parameters/cir_01.json
  format: json
model_family: CIR short rate
row_count: 1000
parameters:
  mean_reversion: Positive mean-reversion speed kappa.
  long_term_mean: Positive long-run short-rate mean theta.
  volatility: Positive square-root diffusion scale sigma.
  initial_state: Non-negative initial short rate r(0).
dynamics:
  short_rate: dr_t = kappa * (theta - r_t) dt + sigma * sqrt(r_t) dW_t
  transition: exact non-central chi-square endpoint transition
  boundary: the exact transition supports both sides of the Feller threshold
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: independent uniform sample
      bounds:
        mean_reversion:
        - 0.03
        - 1.0
        long_term_mean:
        - 0.001
        - 0.08
        initial_state:
        - 0.001
        - 0.08
      seed: 1670000201
      conditional_sampling:
        volatility:
          minimum: max(sqrt(mean_reversion * long_term_mean / 5.000000), 0.005000)
          maximum: min(sqrt(12.000000 * mean_reversion * long_term_mean), 0.300000)
          distribution: uniform conditional on mean_reversion and long_term_mean
          seed: 1670000202
        feller_ratio:
          definition: 2 * mean_reversion * long_term_mean / volatility^2
          guaranteed_minimum: 1 / 6
          guaranteed_maximum: 10.0
          feller_condition_threshold: 1.0
        purpose: cover accessible and inaccessible zero-boundary regimes
  stress:
    row_count: 100
    generation:
      method: independent uniform sample
      bounds:
        mean_reversion:
        - 0.02
        - 1.5
        long_term_mean:
        - 0.0005
        - 0.12
        initial_state:
        - 0.0
        - 0.12
      seed: 1670000203
      conditional_sampling:
        volatility:
          minimum: max(sqrt(mean_reversion * long_term_mean / 5.000000), 0.005000)
          maximum: min(sqrt(12.000000 * mean_reversion * long_term_mean), 0.300000)
          distribution: uniform conditional on mean_reversion and long_term_mean
          seed: 1670000204
        feller_ratio:
          definition: 2 * mean_reversion * long_term_mean / volatility^2
          guaranteed_minimum: 1 / 6
          guaranteed_maximum: 10.0
          feller_condition_threshold: 1.0
        purpose: cover accessible and inaccessible zero-boundary regimes
