schema_version: 1
kind: model_parameters
dataset_id: ornstein_uhlenbeck_01
generator: catalog/parameters/model/fixed_income/ornstein_uhlenbeck/parameters/ornstein_uhlenbeck_01/generator.cpp
output:
  path: datasets/parameters/model/fixed_income/ornstein_uhlenbeck/parameters/ornstein_uhlenbeck_01.json
  format: json
model_family: Ornstein-Uhlenbeck short rate
row_count: 1000
parameters:
  mean_reversion: Positive mean-reversion speed a.
  volatility: Instantaneous short-rate volatility sigma.
  initial_state: Initial short rate x(0).
dynamics:
  state: dx_t = -a x_t dt + sigma dW_t
  short_rate: r_t = x_t
  transition: exact Gaussian state and optional joint state-integral transitions
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: stationary-dispersion reconstruction
      sampled_factors:
        mean_reversion:
          uniform_bounds:
          - 0.03
          - 1.0
        initial_state:
          uniform_bounds:
          - 0.001
          - 0.08
        stationary_standard_deviation:
          definition: sigma / sqrt(2 * mean_reversion)
          uniform_bounds:
          - 0.0025
          - 0.025
      reconstruction:
        volatility: stationary_standard_deviation * sqrt(2 * mean_reversion)
  stress:
    row_count: 100
    generation:
      method: stationary-dispersion reconstruction
      sampled_factors:
        mean_reversion:
          uniform_bounds:
          - 0.02
          - 1.5
        initial_state:
          uniform_bounds:
          - -0.02
          - 0.12
        stationary_standard_deviation:
          definition: sigma / sqrt(2 * mean_reversion)
          uniform_bounds:
          - 0.001
          - 0.04
      reconstruction:
        volatility: stationary_standard_deviation * sqrt(2 * mean_reversion)
