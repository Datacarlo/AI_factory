schema_version: 1
kind: model_parameters
dataset_id: g2_01
generator: catalog/parameters/model/fixed_income/g2/parameters/g2_01/generator.cpp
output:
  path: datasets/parameters/model/fixed_income/g2/parameters/g2_01.json
  format: json
model_family: G2 Gaussian two-factor short rate
row_count: 1000
parameters:
  mean_reversion_x: Positive mean-reversion speed a.
  volatility_x: Non-negative first-factor volatility sigma.
  mean_reversion_y: Positive mean-reversion speed b above a.
  volatility_y: Non-negative second-factor volatility eta.
  correlation: Brownian correlation rho in [-1, 1].
  initial_state_x: Initial first Gaussian factor x(0).
  initial_state_y: Initial second Gaussian factor y(0).
dynamics:
  state_x: dx_t = -a x_t dt + sigma dW_t^x
  state_y: dy_t = -b y_t dt + eta dW_t^y
  correlation: d<W^x,W^y>_t = rho dt
  short_rate: r_t = x_t + y_t
  initial_short_rate: r(0) = x(0) + y(0)
  transition: exact correlated Gaussian transitions
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: ordered mean reversions and stationary dispersions
      sampled_factors:
        mean_reversion_x:
          uniform_bounds:
          - 0.03
          - 0.35
        mean_reversion_gap:
          definition: mean_reversion_y - mean_reversion_x
          uniform_bounds:
          - 0.1
          - 1.0
        stationary_standard_deviation_x:
          definition: volatility_x / sqrt(2 * mean_reversion_x)
          uniform_bounds:
          - 0.0025
          - 0.018
        stationary_standard_deviation_y:
          definition: volatility_y / sqrt(2 * mean_reversion_y)
          uniform_bounds:
          - 0.0015
          - 0.012
        correlation:
          uniform_bounds:
          - -0.75
          - -0.05
        initial_state_x:
          uniform_bounds:
          - 0.001
          - 0.05
        initial_state_y:
          uniform_bounds:
          - 0.001
          - 0.03
      reconstruction:
        mean_reversion_y: mean_reversion_x + mean_reversion_gap
        volatility_x: stationary_standard_deviation_x * sqrt(2 * mean_reversion_x)
        volatility_y: stationary_standard_deviation_y * sqrt(2 * mean_reversion_y)
  stress:
    row_count: 100
    generation:
      method: ordered mean reversions and stationary dispersions
      sampled_factors:
        mean_reversion_x:
          uniform_bounds:
          - 0.02
          - 0.5
        mean_reversion_gap:
          definition: mean_reversion_y - mean_reversion_x
          uniform_bounds:
          - 0.05
          - 1.3
        stationary_standard_deviation_x:
          definition: volatility_x / sqrt(2 * mean_reversion_x)
          uniform_bounds:
          - 0.0015
          - 0.025
        stationary_standard_deviation_y:
          definition: volatility_y / sqrt(2 * mean_reversion_y)
          uniform_bounds:
          - 0.001
          - 0.018
        correlation:
          uniform_bounds:
          - -0.9
          - -0.02
        initial_state_x:
          uniform_bounds:
          - -0.02
          - 0.08
        initial_state_y:
          uniform_bounds:
          - -0.02
          - 0.06
      reconstruction:
        mean_reversion_y: mean_reversion_x + mean_reversion_gap
        volatility_x: stationary_standard_deviation_x * sqrt(2 * mean_reversion_x)
        volatility_y: stationary_standard_deviation_y * sqrt(2 * mean_reversion_y)
