schema_version: 1
kind: model_parameters
dataset_id: hull_white_01
generator: catalog/parameters/model/fixed_income/hull_white/parameters/hull_white_01/generator.cpp
output:
  path: datasets/parameters/model/fixed_income/hull_white/parameters/hull_white_01.json
  format: json
model_family: Hull-White one-factor
row_count: 1000
parameters:
  mean_reversion: Positive mean-reversion speed a.
  volatility: Non-negative short-rate volatility sigma.
dynamics:
  state: dx_t = -a x_t dt + sigma dW_t
  short_rate: r_t = x_t + phi(t)
  transition: x and its integral are simulated jointly and exactly; the curve shift
    is integrated analytically
  curve_fit: phi(t) is determined by the initial instantaneous forward curve f(0,t)
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: stationary-dispersion reconstruction
      sampled_factors:
        mean_reversion:
          uniform_bounds:
          - 0.03
          - 1.0
        stationary_standard_deviation:
          definition: sigma / sqrt(2 * mean_reversion)
          uniform_bounds:
          - 0.0025
          - 0.025
      reconstruction:
        volatility: stationary_standard_deviation * sqrt(2 * mean_reversion)
  stress:
    row_count: 100
    generation:
      method: stationary-dispersion reconstruction
      sampled_factors:
        mean_reversion:
          uniform_bounds:
          - 0.02
          - 1.5
        stationary_standard_deviation:
          definition: sigma / sqrt(2 * mean_reversion)
          uniform_bounds:
          - 0.001
          - 0.04
      reconstruction:
        volatility: stationary_standard_deviation * sqrt(2 * mean_reversion)
