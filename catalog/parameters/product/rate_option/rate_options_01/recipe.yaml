quote_convention:
  strike:
    mode: additive_to_initial_simple_forward_rate
    unit: annualized_decimal_rate
    effective_level: strike = initial_simple_forward_rate + strike_spread
parameters:
  notional: Normalized contract notional.
  strike: Annualized decimal spread from the initial simple forward rate; 0.005 means
    +50 bp.
  fixing_time: Forward-rate fixing time T1 in business days.
  payment_time: Cashflow payment time T2 in business days.
  accrual_period: Business days in the interval [T1, T2].
payoff:
  expression: N * delta * max(side * (L(T1; T1, T2) - K), 0), side = +1 caplet / -1
