    unit: annualized_decimal_rate
    effective_level: strike = initial_first_exercise_par_swap_rate + strike_spread
  reference_policy: Resolved at the unbumped model and initial curve; absolute contract
    levels stay fixed for model and curve bumps.
parameters:
  notional: Contract notional N.
  strike: Annualized decimal spread from the initial par swap rate; 0.005 means +50
    bp.
  accrual_fraction: Constant contractual coupon year fraction delta.
  first_exercise_time: First exercise and initial swap-start date in business days.
  payment_interval: Business days between payments and exercise opportunities.
  payment_count: Payments from first exercise to final maturity.
  exercise_count: Co-terminal exercise opportunities.
payoff:
  expression: max over exercise policy of N * max(omega * (1 - P(t,T_N) - K * sum_{i>j}
    delta * P(t,T_i)), 0), omega = +1 payer / -1 receiver
  exercise_dates: first_exercise_time + j * payment_interval, j = 0,...,exercise_count-1
  underlying: At exercise j, the remaining co-terminal swap.
  settlement: physical
  normalization: N = 1
