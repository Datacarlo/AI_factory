  format: json
product_family: Zero-Coupon Bond Up-and-Out Calls
row_count: 1000
time_convention:
  unit: business_day
  days_per_year: 252
quote_convention:
  strike:
    mode: ratio_to_initial_forward_bond_price
    unit: dimensionless
    effective_level: strike = strike_ratio * P(0,U)/P(0,T)
  barrier:
    mode: ratio_to_initial_bond_price
    unit: dimensionless
    effective_level: barrier = barrier_ratio * P(0,U)
parameters:
  notional: Units of a zero-coupon bond paying 1 currency unit at U.
  strike: Dimensionless ratio to P(0,U)/P(0,T).
  barrier: Dimensionless ratio to P(0,U); exceeds 1 in core rows.
  option_expiry: Payoff date T in business days.
  bond_maturity: Bond face-value date U > T in business days.
payoff:
  expression: N * exp(-integral_0^T r_s ds) * max(P(T,U)-K,0) * 1{P(t,U)<B for all
    monitored t}
  payment_time: T
  normalization: N = 1
  barrier_breach: P(t,U) >= B, including t=0
  monitoring: numerical grid; continuous-barrier price is approximated
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
