schema_version: 1
kind: product_parameters
dataset_id: cliquets_01
generator: catalog/parameters/product/cliquet/cliquets_01/generator.cpp
output:
  path: datasets/parameters/product/cliquet/cliquets_01.json
  format: json
product_family: Cliquets
row_count: 1000
time_convention:
  unit: business_day
  days_per_year: 252
quote_convention:
  periodic_return:
    mode: S(t_i)/S(t_{i-1}) - 1
    unit: dimensionless
  local_floor:
    mode: periodic_return_bound
    unit: dimensionless
  local_cap:
    mode: periodic_return_bound
    unit: dimensionless
  global_floor:
    mode: cumulative_return_bound
    unit: dimensionless
  global_cap:
    mode: cumulative_return_bound
    unit: dimensionless
parameters:
  maturity: Time from issuance to final payment in business days.
  observation_interval: Business days between consecutive return observations.
  participation_rate: Multiplier applied to every periodic spot return.
  local_floor: Lower bound applied to each periodic return.
  local_cap: Upper bound applied to each periodic return.
  global_floor: Lower bound applied to the accumulated return.
  global_cap: Upper bound applied to the accumulated return.
payoff:
  periodic_return: R_i = S(t_i) / S(t_{i-1}) - 1; R_i = 0 when both spots are zero. The first loss into zero is retained. Local bounds apply afterwards.
  local_return: clamp(participation_rate * R_i, local_floor, local_cap)
  accumulated_return: clamp(sum of local returns, global_floor, global_cap)
  maturity_payment: Normalized nominal 1 plus the accumulated return.
  intermediate_payments: None.
construction:
  method: ordered 90/10 constrained core-stress sample
  row_order:
    core: rows 1-900
    stress: remaining rows
  core_share: 0.9
  stress_share: 0.1
  valuation_time: issuance
  spot_quote_convention: Returns use S(t_i)/S(t_{i-1}) for each paired model.
  nominal: 1.0
  sampling:
    regime_counts: 900 core rows and 100 stress rows
    observation_interval: uniform categorical draw within the selected regime
    observation_count: uniform integer draw compatible with maturity bounds
    continuous_parameters: uniform draws within the selected regime bounds
    global_bounds: conditional draws from the theoretical sum of local bounds
  calendar_rules:
  - maturity is an integer multiple of observation_interval
  - observation dates are i * observation_interval from issuance
  - the first return compares S at issuance with the first observation
  - core rows precede stress rows
  regimes:
    core:
      row_count: 900
      maturity:
      - 252
      - 1260
      observation_interval:
      - 21
      - 63
      participation_rate:
      - 0.8
      - 1.2
      local_floor:
      - -0.05
      - 0.0
      local_cap:
      - 0.01
      - 0.08
      global_floor:
      - 0.0
      - 0.03
      global_cap: 25% to 85% of the bounded theoretical local-cap sum
    stress:
      row_count: 100
      maturity:
      - 126
      - 1512
      observation_interval:
      - 5
      - 126
      - 252
      participation_rate:
      - 0.5
      - 1.5
      local_floor:
      - -0.15
      - 0.0
      local_cap:
      - 0.005
      - 0.2
      global_floor:
      - -0.3
      - 0.0
      global_cap: 10% to 95% of the bounded theoretical local-cap sum
  constraints:
  - local_floor < local_cap
  - -1 < global_floor < global_cap
  - global_cap is bounded by 0.75 in core and 1.00 in stress
