schema_version: 1
kind: product_parameters
dataset_id: forward_start_options_01
generator: catalog/parameters/product/forward_start_option/forward_start_options_01/generator.cpp
output:
  path: datasets/parameters/product/forward_start_option/forward_start_options_01.json
  format: json
product_family: Forward-Start Options
row_count: 1000
time_convention:
  unit: business_day
  days_per_year: 252
quote_convention:
  moneyness:
    mode: multiplier_of_reset_spot
    unit: dimensionless
    effective_level: moneyness * S(reset_time)
parameters:
  moneyness: Strike multiplier applied to the reset spot.
  reset_time: Business day when the floating strike is fixed.
  maturity: Maturity in business days.
payoff:
  expression: max(side * (S_T - moneyness * S_reset), 0), side = +1 call / -1 put
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: maturity-dependent exponential grid
      rule: For each T in business days, x is linearly spaced on [-aT/252, aT/252]
        and K = exp(x).
      grid:
        maturity:
          minimum: 21
          maximum: 756
          count: 45
          spacing: linear
        strike:
          count_per_maturity: 20
          spacing: linear in log-strike
          conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
          a: 0.2
  stress:
    row_count: 100
    generation:
      method: maturity-dependent exponential grid
      rule: For each T in business days, x is linearly spaced on [-aT/252, aT/252]
        and K = exp(x).
      grid:
        maturity:
          minimum: 5
          maximum: 1260
          count: 10
          spacing: linear
        strike:
          count_per_maturity: 10
          spacing: linear in log-strike
          conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
          a: 0.2
  grid:
    maturity:
      core:
        minimum: 21
        maximum: 756
        count: 45
        spacing: linear
      stress:
        minimum: 5
        maximum: 1260
        count: 10
        spacing: linear
    moneyness:
      core:
        count_per_maturity: 20
        conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
        a: 0.2
      stress:
        count_per_maturity: 10
        conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
        a: 0.2
      spacing: linear in log-strike
  reset_time:
    rule: floor(maturity / 2) business days
