schema_version: 1
kind: product_parameters
dataset_id: athena_autocalls_01
generator: catalog/parameters/product/athena_autocall/athena_autocalls_01/generator.cpp
output:
  path: datasets/parameters/product/athena_autocall/athena_autocalls_01.json
  format: json
product_family: Athena Autocalls
row_count: 1000
time_convention:
  unit: business_day
  days_per_year: 252
quote_convention:
  autocall_barrier:
    mode: ratio_to_central_spot
    unit: dimensionless
    effective_level: autocall_barrier * S0
  protection_barrier:
    mode: ratio_to_central_spot
    unit: dimensionless
    effective_level: protection_barrier * S0
  reference_policy: Resolved at the unbumped model spot S0 for each model-product
    pair; absolute contract levels remain fixed for model bumps.
parameters:
  maturity: Time from issuance to final redemption in business days.
  observation_interval: Business days between observation dates.
  autocall_barrier: Dimensionless ratio of the quoted spot level to the central model
    spot S0; 1.0 means 100% of S0.
  protection_barrier: Dimensionless ratio of the quoted spot level to the central
    model spot S0; 1.0 means 100% of S0.
  annual_coupon_rate: Annual gain rate accumulated until redemption.
payoff:
  intermediate_payments: 'None: the accumulated gain is paid only at redemption.'
  early_redemption: At observation time t before maturity, S_t >= autocall_barrier
    pays 1 + annual_coupon_rate * t and terminates the note.
  successful_maturity: At maturity, S_T >= autocall_barrier pays 1 + annual_coupon_rate
    * maturity.
  protected_redemption: At maturity, protection_barrier <= S_T < autocall_barrier
    repays nominal 1 without gain.
  unprotected_redemption: At maturity, S_T < protection_barrier repays S_T / S_ref
    on unit notional, with S_ref fixed at issuance.
  protection_monitoring: 'European: protection_barrier is observed only at maturity.'
construction:
  method: ordered 90/10 constrained core-stress sample
  row_order:
    core: rows 1-900
    stress: remaining rows
  core_share: 0.9
  stress_share: 0.1
  valuation_time: issuance
  spot_quote_convention: Barriers are ratios to each paired model central S0; 1.0
    represents 100%.
  nominal: 1.0
  sampling:
    regime_counts: 900 core rows and 100 stress rows
    observation_interval: uniform categorical draw within the selected regime
    observation_count: uniform integer draw among counts compatible with the regime
      maturity bounds
    continuous_parameters: uniform draws within the selected regime bounds
    barriers: draw protection first, then autocall above protection
  calendar_rules:
  - maturity is an integer multiple of observation_interval
  - observation dates are i * observation_interval from issuance
  - core rows precede stress rows
  regimes:
    core:
      row_count: 900
      maturity:
      - 252
      - 1260
      observation_interval:
      - 21
      - 63
      autocall_barrier:
      - 0.95
      - 1.1
      protection_barrier:
      - 0.5
      - 0.7
      annual_coupon_rate:
      - 0.03
      - 0.15
    stress:
      row_count: 100
      maturity:
      - 126
      - 1512
      observation_interval:
      - 5
      - 126
      - 252
      autocall_barrier:
      - 0.9
      - 1.2
      protection_barrier:
      - 0.4
      - 0.8
      annual_coupon_rate:
      - 0.01
      - 0.2
  barrier_rule: protection_barrier <= autocall_barrier
