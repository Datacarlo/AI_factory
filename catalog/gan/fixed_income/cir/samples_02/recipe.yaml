schema_version: 1
kind: terminal_gan
id: cir__samples_02__gan_256
model: cir
training: catalog/gan/fixed_income/cir/samples_02/training.py
dataset:
  id: samples_02
  path: datasets/samples/fixed_income/cir/samples_02.json
inputs:
  conditions:
  - mean_reversion
  - long_term_mean
  - volatility
  - initial_state
  - T
  fixed: {}
  time_convention:
    days_per_year: 252
    T: maturity_days / 252
observable:
  name: state
  transform:
    name: log_shift
    offset: 1.0e-12
reference:
  path: gan/fixed_income/cir/samples_02/reference.npz
  groups_per_split: 128
  paths_per_condition: 8192
  simulation_seed: 2026112091827
  method: Exact terminal noncentral chi-square transition
  selection: stored_in_archive
data:
  training_rows: all
  normalization: training_only
network:
  hidden_sizes:
  - 256
  - 256
  - 256
  activation: softplus
  softplus_beta: 10
  embedding_size: 150
  latent_dimension: 5
  latent_distribution: uniform_0_1
objective: logistic
training_options:
  seed: 1701
  epochs: 53
  batch_size: 2000
  critic_steps: 5
  generator_learning_rate: 0.0001
  critic_learning_rate: 0.0001
  adam_betas:
  - 0.5
  - 0.9
  scheduler: plateau
  plateau_patience: 2
  plateau_factor: 0.5
  minimum_learning_rate: 1.0e-06
  validation_min_delta: 0.001
  early_stopping_patience: 6
  minimum_epochs: 9
  ema_decay: 0.99
  validation_interval: 1
  log_interval: 50
  deterministic: true
  num_workers: 0
  device: cuda
evaluation:
  validation_seed: 941
  test_seed: 942
  select: validation
  score: mean(W1 / reference_std + 0.1 * abs(log(generated_std / reference_std)))
output:
  model: gan/fixed_income/cir/samples_02/model.pt
  metrics: gan/fixed_income/cir/samples_02/metrics.json
