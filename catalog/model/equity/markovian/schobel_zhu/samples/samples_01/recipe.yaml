schema_version: 1
kind: samples
dataset_id: samples_01
generator: catalog/model/equity/markovian/schobel_zhu/samples/samples_01/generator.cpp
model: schobel_zhu
output:
  path: datasets/model/equity/markovian/schobel_zhu/samples/samples_01.json
  format: json
row_count: 3000000
shape:
  parameter_count: 12000
  paths_per_parameter: 250
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - spot
  - initial_volatility
  - mean_reversion
  - long_run_volatility
  - volatility_of_volatility
  - correlation
  latent_uniform_bounds:
    spot:
    - 1.0
    - 1.0
    initial_volatility:
    - 0.08
    - 0.45
    mean_reversion:
    - 0.3
    - 5.0
    long_run_volatility:
    - 0.08
    - 0.45
    volatility_of_volatility:
    - 0.03
    - 0.6
    correlation:
    - -0.9
    - -0.1
  acceptance: 'true'
  derived_parameters: {}
  fixed_model_inputs:
    risk_free_rate: 0.0
    dividend_yield: 0.0
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668827957366882304
  schedule: 11668827958440624128
  dynamics: 11668827959514365952
random_number_generator: philox
numerical_method:
  engine: sample_markovian
  description: exact OU factor with log-spot Euler
outputs:
  spot:
    description: Terminal spot.
    layout: sample-major
  volatility:
    description: Terminal volatility.
    layout: sample-major
time_grid:
  transition: fixed-step
  delta_t: 1 / 504
  simulation_steps_per_day: 2
