schema_version: 1
kind: samples
dataset_id: samples_02
generator: catalog/model/equity/markovian/heston/samples/samples_02/generator.cpp
model: heston
output:
  path: datasets/model/equity/markovian/heston/samples/samples_02.json
  format: json
row_count: 3000000
shape:
  parameter_count: 3000000
  paths_per_parameter: 1
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - spot
  - initial_variance
  - kappa
  - theta
  - rho
  latent_uniform_bounds:
    spot:
    - 1.0
    - 1.0
    initial_variance:
    - 0.01
    - 0.12
    kappa:
    - 0.5
    - 4.0
    theta:
    - 0.01
    - 0.15
    rho:
    - -0.95
    - -0.25
  acceptance: 'true'
  derived_parameters:
    gamma: After all latent uniform draws, draw gamma uniformly on [max(sqrt(kappa
      * theta / 5), 0.08), min(sqrt(12 * kappa * theta), 0.8)] using the next Philox
      uniform.
  fixed_model_inputs:
    risk_free_rate: 0.0
    dividend_yield: 0.0
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668827128438194176
  schedule: 11668827129511936000
  dynamics: 11668827130585677824
random_number_generator: philox
numerical_method:
  engine: sample_markovian
  description: Andersen QE-M
outputs:
  spot:
    description: Terminal spot.
    layout: sample-major
  variance:
    description: Terminal variance.
    layout: sample-major
time_grid:
  transition: fixed-step
  delta_t: 1 / 504
  simulation_steps_per_day: 2
