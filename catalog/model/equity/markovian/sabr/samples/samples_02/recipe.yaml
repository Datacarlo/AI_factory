schema_version: 1
kind: samples
dataset_id: samples_02
generator: catalog/model/equity/markovian/sabr/samples/samples_02/generator.cpp
model: sabr
output:
  path: datasets/model/equity/markovian/sabr/samples/samples_02.json
  format: json
row_count: 3000000
shape:
  parameter_count: 3000000
  paths_per_parameter: 1
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - spot
  - initial_volatility
  - volatility_of_volatility
  - rho
  - beta
  latent_uniform_bounds:
    spot:
    - 0.25
    - 4.0
    initial_volatility:
    - 0.08
    - 0.5
    volatility_of_volatility:
    - 0.1
    - 1.5
    rho:
    - -0.9
    - -0.2
    beta:
    - 0.5
    - 0.95
  acceptance: 'true'
  derived_parameters: {}
  fixed_model_inputs:
    risk_free_rate: 0.0
    dividend_yield: 0.0
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668827819927928832
  schedule: 11668827821001670656
  dynamics: 11668827822075412480
random_number_generator: philox
numerical_method:
  engine: sample_markovian
  description: Lamperti SABR Euler
outputs:
  spot:
    description: Terminal spot.
    layout: sample-major
  alpha:
    description: Terminal alpha.
    layout: sample-major
time_grid:
  transition: fixed-step
  delta_t: 1 / 504
  simulation_steps_per_day: 2
