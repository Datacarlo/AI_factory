schema_version: 1
kind: samples
dataset_id: samples_01
generator: catalog/model/equity/markovian/black_scholes/samples/samples_01/generator.cpp
model: black_scholes
output:
  path: datasets/model/equity/markovian/black_scholes/samples/samples_01.json
  format: json
row_count: 3000000
shape:
  parameter_count: 12000
  paths_per_parameter: 250
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - spot
  - volatility
  latent_uniform_bounds:
    spot:
    - 1.0
    - 1.0
    volatility:
    - 0.08
    - 0.45
  acceptance: 'true'
  derived_parameters: {}
  fixed_model_inputs:
    risk_free_rate: 0.0
    dividend_yield: 0.0
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668826840675385344
  schedule: 11668826841749127168
  dynamics: 11668826842822868992
random_number_generator: philox
numerical_method:
  engine: sample_markovian
  description: Exact Gaussian log-price transitions
outputs:
  spot:
    description: Terminal spot.
    layout: sample-major
time_grid:
  transition: exact
  delta_t: maturity_days / 252
  artificial_substeps: false
