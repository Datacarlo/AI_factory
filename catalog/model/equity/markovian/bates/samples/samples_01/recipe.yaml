schema_version: 1
kind: samples
dataset_id: samples_01
generator: catalog/model/equity/markovian/bates/samples/samples_01/generator.cpp
model: bates
output:
  path: datasets/model/equity/markovian/bates/samples/samples_01.json
  format: json
row_count: 3000000
shape:
  parameter_count: 12000
  paths_per_parameter: 250
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - spot
  - initial_variance
  - kappa
  - theta
  - rho
  - jump_intensity
  - jump_log_mean
  - jump_log_volatility
  latent_uniform_bounds:
    spot:
    - 1.0
    - 1.0
    initial_variance:
    - 0.01
    - 0.12
    kappa:
    - 0.5
    - 4.0
    theta:
    - 0.01
    - 0.15
    rho:
    - -0.95
    - -0.25
    jump_intensity:
    - 0.02
    - 1.0
    jump_log_mean:
    - -0.25
    - 0.05
    jump_log_volatility:
    - 0.05
    - 0.35
  acceptance: 'true'
  derived_parameters:
    gamma: After all latent uniform draws, draw gamma uniformly on [max(sqrt(kappa
      * theta / 5), 0.1), min(sqrt(12 * kappa * theta), 0.8)] using the next Philox
      uniform.
  fixed_model_inputs:
    risk_free_rate: 0.0
    dividend_yield: 0.0
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668826767660941312
  schedule: 11668826768734683136
  dynamics: 11668826769808424960
random_number_generator: philox
numerical_method:
  engine: sample_markovian
  description: Andersen QE-M with compound-Poisson lognormal jumps
outputs:
  spot:
    description: Terminal spot.
    layout: sample-major
  variance:
    description: Terminal variance.
    layout: sample-major
time_grid:
  transition: fixed-step
  delta_t: 1 / 504
  simulation_steps_per_day: 2
