schema_version: 1
kind: samples
dataset_id: samples_01
generator: catalog/model/equity/markovian/cev/samples/samples_01/generator.cpp
model: cev
output:
  path: datasets/model/equity/markovian/cev/samples/samples_01.json
  format: json
row_count: 3000000
shape:
  parameter_count: 12000
  paths_per_parameter: 250
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - spot
  - sigma
  - beta
  latent_uniform_bounds:
    spot:
    - 0.25
    - 4.0
    sigma:
    - 0.08
    - 0.45
    beta:
    - 0.55
    - 0.95
  acceptance: 'true'
  derived_parameters: {}
  fixed_model_inputs:
    risk_free_rate: 0.0
    dividend_yield: 0.0
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668826982409306112
  schedule: 11668826983483047936
  dynamics: 11668826984556789760
random_number_generator: philox
numerical_method:
  engine: sample_markovian
  description: absorbed Milstein
outputs:
  spot:
    description: Terminal spot.
    layout: sample-major
time_grid:
  transition: fixed-step
  delta_t: 1 / 504
  simulation_steps_per_day: 2
