schema_version: 1
kind: samples
dataset_id: samples_01
generator: catalog/model/equity/markovian/stein_stein/samples/samples_01/generator.cpp
model: stein_stein
output:
  path: datasets/model/equity/markovian/stein_stein/samples/samples_01.json
  format: json
row_count: 3000000
shape:
  parameter_count: 12000
  paths_per_parameter: 250
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - spot
  - initial_volatility
  - mean_reversion
  - volatility_of_volatility
  - rho
  latent_uniform_bounds:
    spot:
    - 1.0
    - 1.0
    initial_volatility:
    - 0.1
    - 0.35
    mean_reversion:
    - 0.5
    - 8.0
    volatility_of_volatility:
    - 0.05
    - 0.5
    rho:
    - -0.75
    - -0.1
  acceptance: 'true'
  derived_parameters: {}
  fixed_model_inputs:
    risk_free_rate: 0.0
    dividend_yield: 0.0
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668828090510868480
  schedule: 11668828091584610304
  dynamics: 11668828092658352128
random_number_generator: philox
numerical_method:
  engine: sample_markovian
  description: exact OU volatility with log-spot Euler
outputs:
  spot:
    description: Terminal spot.
    layout: sample-major
  volatility:
    description: Terminal volatility.
    layout: sample-major
time_grid:
  transition: fixed-step
  delta_t: 1 / 504
  simulation_steps_per_day: 2
