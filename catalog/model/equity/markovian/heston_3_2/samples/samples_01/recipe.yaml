schema_version: 1
kind: samples
dataset_id: samples_01
generator: catalog/model/equity/markovian/heston_3_2/samples/samples_01/generator.cpp
model: heston_3_2
output:
  path: datasets/model/equity/markovian/heston_3_2/samples/samples_01.json
  format: json
row_count: 3000000
shape:
  parameter_count: 12000
  paths_per_parameter: 250
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - spot
  - initial_variance
  - mean_reversion
  - long_run_variance
  - volatility_of_variance
  - rho
  latent_uniform_bounds:
    spot:
    - 1.0
    - 1.0
    initial_variance:
    - 0.01
    - 0.09
    mean_reversion:
    - 5.0
    - 40.0
    long_run_variance:
    - 0.015
    - 0.09
    volatility_of_variance:
    - 1.0
    - 8.0
    rho:
    - -0.95
    - -0.1
  acceptance: 'true'
  derived_parameters: {}
  fixed_model_inputs:
    risk_free_rate: 0.0
    dividend_yield: 0.0
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668827257287213056
  schedule: 11668827258360954880
  dynamics: 11668827259434696704
random_number_generator: philox
numerical_method:
  engine: sample_markovian
  description: full-truncation Euler 3/2 variance
outputs:
  spot:
    description: Terminal spot.
    layout: sample-major
  reciprocal_variance:
    description: Terminal reciprocal_variance.
    layout: sample-major
time_grid:
  transition: fixed-step
  delta_t: 1 / 504
  simulation_steps_per_day: 2
