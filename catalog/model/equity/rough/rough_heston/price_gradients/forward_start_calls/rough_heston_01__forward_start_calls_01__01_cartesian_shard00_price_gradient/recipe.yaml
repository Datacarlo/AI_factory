    boundary: central_then_one_sided_order2
  - parameter: model.initial_variance
    displacement: 0.001
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.mean_reversion
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.variance_drift
    displacement: 0.001
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.volatility_of_variance
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.hurst_exponent
    displacement: 0.001
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.rho
