schema_version: 1
kind: samples
dataset_id: samples_02
generator: catalog/model/equity/rough/rough_heston/samples/samples_02/generator.cpp
model: rough_heston
output:
  path: datasets/model/equity/rough/rough_heston/samples/samples_02.json
  format: json
row_count: 3000000
shape:
  parameter_count: 3000000
  paths_per_parameter: 1
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - spot
  - initial_variance
  - mean_reversion
  - long_run_variance
  - hurst_exponent
  - rho
  latent_uniform_bounds:
    spot:
    - 1.0
    - 1.0
    initial_variance:
    - 0.01
    - 0.12
    mean_reversion:
    - 0.5
    - 4.0
    long_run_variance:
    - 0.01
    - 0.15
    hurst_exponent:
    - 0.03
    - 0.25
    rho:
    - -0.95
    - -0.25
  acceptance: 'true'
  derived_parameters:
    variance_drift: variance_drift = mean_reversion * long_run_variance.
    volatility_of_variance: After all latent uniform draws, draw volatility_of_variance
      uniformly on [max(sqrt(variance_drift / 5), 0.08), min(sqrt(12 * variance_drift),
      0.8)] using the next Philox uniform.
  kernel_preparation:
    method: positive bounded-L2 fit at sampled H
    preparation_location: GPU per sampled parameter row
    horizon_years: 2.0
    delta_t: 1 / 504
  fixed_model_inputs:
    risk_free_rate: 0.0
    dividend_yield: 0.0
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668828769115701248
  schedule: 11668828770189443072
  dynamics: 11668828771263184896
random_number_generator: philox
numerical_method:
  engine: sample_n_factor
  description: 7-factor Markovian lift
outputs:
  spot:
    description: Terminal spot.
    layout: sample-major
time_grid:
  transition: fixed-step
  delta_t: 1 / 504
  simulation_steps_per_day: 2
