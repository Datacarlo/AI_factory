schema_version: 1
kind: samples
dataset_id: samples_01
generator: catalog/model/equity/rough/log_modulated_rough_bergomi/samples/samples_01/generator.cpp
model: log_modulated_rough_bergomi
output:
  path: datasets/model/equity/rough/log_modulated_rough_bergomi/samples/samples_01.json
  format: json
row_count: 3000000
shape:
  parameter_count: 12000
  paths_per_parameter: 250
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - spot
  - xi_0
  - eta
  - hurst_exponent
  - rho
  - log_modulation_scale
  - log_modulation_power
  latent_uniform_bounds:
    spot:
    - 1.0
    - 1.0
    xi_0:
    - 0.01
    - 0.09
    eta:
    - 0.5
    - 3.0
    hurst_exponent:
    - 0.01
    - 0.2
    rho:
    - -0.95
    - -0.2
    log_modulation_scale:
    - 0.03
    - 0.3
    log_modulation_power:
    - 1.2
    - 4.0
  acceptance: 'true'
  derived_parameters: {}
  fixed_model_inputs:
    risk_free_rate: 0.0
    dividend_yield: 0.0
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668828365388775424
  schedule: 11668828366462517248
  dynamics: 11668828367536259072
random_number_generator: philox
numerical_method:
  engine: sample_volterra_fft
  description: log-modulated hybrid FFT (kappa=1)
outputs:
  spot:
    description: Terminal spot.
    layout: sample-major
time_grid:
  transition: fixed-step
  delta_t: 1 / 504
  simulation_steps_per_day: 2
