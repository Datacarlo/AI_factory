schema_version: 1
kind: samples
dataset_id: samples_02
generator: catalog/model/equity/rough/quadratic_rough_heston/samples/samples_02/generator.cpp
model: quadratic_rough_heston
output:
  path: datasets/model/equity/rough/quadratic_rough_heston/samples/samples_02.json
  format: json
row_count: 3000000
shape:
  parameter_count: 3000000
  paths_per_parameter: 1
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - spot
  - initial_feedback
  - quadratic_scale
  - quadratic_shift
  - variance_floor
  - feedback_rate
  - feedback_volatility
  - hurst_exponent
  latent_uniform_bounds:
    spot:
    - 1.0
    - 1.0
    initial_feedback:
    - 0.02
    - 0.15
    quadratic_scale:
    - 0.02
    - 0.12
    quadratic_shift:
    - 0.02
    - 0.15
    variance_floor:
    - 0.0005
    - 0.015
    feedback_rate:
    - 0.1
    - 0.8
    feedback_volatility:
    - 0.1
    - 0.6
    hurst_exponent:
    - 0.05
    - 0.2
  acceptance: 'true'
  derived_parameters: {}
  kernel_preparation:
    method: positive bounded-L2 fit at sampled H
    preparation_location: GPU per sampled parameter row
    horizon_years: 2.0
    delta_t: 1 / 504
  fixed_model_inputs:
    risk_free_rate: 0.0
    dividend_yield: 0.0
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668828502827728896
  schedule: 11668828503901470720
  dynamics: 11668828504975212544
random_number_generator: philox
numerical_method:
  engine: sample_n_factor
  description: 7-factor Markovian lift
outputs:
  spot:
    description: Terminal spot.
    layout: sample-major
time_grid:
  transition: fixed-step
  delta_t: 1 / 504
  simulation_steps_per_day: 2
