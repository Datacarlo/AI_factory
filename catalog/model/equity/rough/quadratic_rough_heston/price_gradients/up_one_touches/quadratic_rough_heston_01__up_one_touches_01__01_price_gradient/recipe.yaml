    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.dividend_yield
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.initial_feedback
    displacement: 0.008
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.quadratic_scale
    displacement: 0.02
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.quadratic_shift
    displacement: 0.008
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.variance_floor
    displacement: 0.12617915378767733
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.feedback_rate
