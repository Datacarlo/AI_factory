schema_version: 1
kind: price_gradients
dataset_id: rough_stein_stein_01__forward_start_puts_01__01_price_gradient
generator: catalog/model/equity/rough/rough_stein_stein/price_gradients/forward_start_puts/rough_stein_stein_01__forward_start_puts_01__01_price_gradient/generator.cpp
inputs:
  model: datasets/model/equity/rough/rough_stein_stein/parameters/rough_stein_stein_01.json
  product: datasets/product/forward_start_option/forward_start_options_01.json
output:
  path: datasets/model/equity/rough/rough_stein_stein/price_gradients/forward_start_puts/rough_stein_stein_01__forward_start_puts_01__01_price_gradient.json
  format: json
row_count: 1000
paths_per_price: 1048576
sensitivity:
  method: finite_difference_shared_innovations
  parameters:
  - parameter: model.risk_free_rate
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.dividend_yield
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.volatility_level
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.mean_reversion
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.volatility_of_volatility
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.hurst_exponent
    displacement: 0.001
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.rho
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: product.moneyness
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: product.maturity_years
    displacement: 0.001984126984126984
    scale: absolute
    boundary: central_then_one_sided_order2
  bump_rule: h = displacement (absolute) or displacement * abs(x) (relative); centered
    when valid, otherwise second-order one-sided.
  reconstructible_from_price:
  - parameter: model.spot
    formula: price / model.spot
    standard_error: standard_error / model.spot
  spot_contract_rule: Spot bumps keep absolute strikes and barriers resolved at the
    central spot fixed; product gradients use quoted ratios.
option_side: put
sensitivity_strategy: node_graph
standard_error_scope: paired Monte Carlo sampling error; excludes bump and discretization
  bias
seeds:
  dynamics: 11668828970979164160
random_number_generator: philox
time_grid:
  steps_per_year: 504
  simulation_steps_per_day: 2
  delta_t: 1 / 504
