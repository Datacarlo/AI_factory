schema_version: 1
kind: samples
dataset_id: samples_02
generator: catalog/model/equity/rough/rough_stein_stein/samples/samples_02/generator.cpp
model: rough_stein_stein
output:
  path: datasets/model/equity/rough/rough_stein_stein/samples/samples_02.json
  format: json
row_count: 3000000
shape:
  parameter_count: 3000000
  paths_per_parameter: 1
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - spot
  - volatility_level
  - mean_reversion
  - volatility_of_volatility
  - hurst_exponent
  - rho
  latent_uniform_bounds:
    spot:
    - 1.0
    - 1.0
    volatility_level:
    - 0.1
    - 0.35
    mean_reversion:
    - 0.2
    - 4.0
    volatility_of_volatility:
    - 0.05
    - 0.5
    hurst_exponent:
    - 0.03
    - 0.25
    rho:
    - -0.9
    - -0.1
  acceptance: 'true'
  derived_parameters: {}
  fixed_model_inputs:
    risk_free_rate: 0.0
    dividend_yield: 0.0
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668829035403673600
  schedule: 11668829036477415424
  dynamics: 11668829037551157248
random_number_generator: philox
numerical_method:
  engine: sample_volterra_fft
  description: fractional-resolvent hybrid FFT
outputs:
  spot:
    description: Terminal spot.
    layout: sample-major
time_grid:
  transition: fixed-step
  delta_t: 1 / 504
  simulation_steps_per_day: 2
