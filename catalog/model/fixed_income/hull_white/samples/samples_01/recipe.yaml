schema_version: 1
kind: samples
dataset_id: samples_01
generator: catalog/model/fixed_income/hull_white/samples/samples_01/generator.cpp
model: hull_white
output:
  path: datasets/model/fixed_income/hull_white/samples/samples_01.json
  format: json
row_count: 3000000
shape:
  parameter_count: 12000
  paths_per_parameter: 250
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - mean_reversion
  - stationary_volatility
  latent_uniform_bounds:
    mean_reversion:
    - 0.03
    - 1.0
    stationary_volatility:
    - 0.0025
    - 0.025
  acceptance: 'true'
  derived_parameters:
    volatility: volatility = stationary_volatility * sqrt(2 * mean_reversion); deterministic
      instantaneous diffusion scale.
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668829117008052224
  schedule: 11668829118081794048
  dynamics: 11668829119155535872
random_number_generator: philox
numerical_method:
  engine: sample_fixed_income
  description: exact OU transition
outputs:
  state:
    description: Terminal state.
    layout: sample-major
time_grid:
  transition: exact
  delta_t: maturity_days / 252
  artificial_substeps: false
