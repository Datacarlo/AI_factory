schema_version: 1
kind: prices
dataset_id: cir_plus_plus_01__svensson_01__floorlets_01__01_cartesian
generator: catalog/model/fixed_income/cir_plus_plus/prices/svensson/floorlets/cir_plus_plus_01__svensson_01__floorlets_01__01_cartesian/generator.cpp
inputs:
