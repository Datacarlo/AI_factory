schema_version: 1
kind: samples
dataset_id: samples_01
generator: catalog/model/fixed_income/g2/samples/samples_01/generator.cpp
model: g2
output:
  path: datasets/model/fixed_income/g2/samples/samples_01.json
  format: json
row_count: 3000000
shape:
  parameter_count: 12000
  paths_per_parameter: 250
  row_order: parameter-major, then path-major
parameter_sampling:
  regime: plausible core only
  distribution: independent Philox uniform proposals with counter-local rejection
    per parameter row
  proposal_draw_order:
  - mean_reversion_x
  - mean_reversion_gap
  - stationary_standard_deviation_x
  - stationary_standard_deviation_y
  - correlation
  - initial_state_x
  - initial_state_y
  latent_uniform_bounds:
    mean_reversion_x:
    - 0.03
    - 0.35
    mean_reversion_gap:
    - 0.1
    - 1.0
    stationary_standard_deviation_x:
    - 0.0025
    - 0.018
    stationary_standard_deviation_y:
    - 0.0015
    - 0.012
    correlation:
    - -0.75
    - -0.05
    initial_state_x:
    - 0.001
    - 0.05
    initial_state_y:
    - 0.001
    - 0.03
  acceptance: 'true'
  derived_parameters:
    mean_reversion_y: mean_reversion_y = mean_reversion_x + mean_reversion_gap.
    volatility_x: volatility_x = stationary_standard_deviation_x * sqrt(2 * mean_reversion_x).
    volatility_y: volatility_y = stationary_standard_deviation_y * sqrt(2 * mean_reversion_y).
maturity_sampling:
  distribution: discrete uniform without modulo bias
  support: integer business days
  minimum_days: 63
  maximum_days: 504
  year_fraction: maturity_days / 252
seeds:
  parameters: 11668829065468444672
  schedule: 11668829066542186496
  dynamics: 11668829067615928320
random_number_generator: philox
numerical_method:
  engine: sample_fixed_income
  description: exact correlated Gaussian transition
outputs:
  state_x:
    description: Terminal state_x.
    layout: sample-major
  state_y:
    description: Terminal state_y.
    layout: sample-major
time_grid:
  transition: exact
  delta_t: maturity_days / 252
  artificial_substeps: false
