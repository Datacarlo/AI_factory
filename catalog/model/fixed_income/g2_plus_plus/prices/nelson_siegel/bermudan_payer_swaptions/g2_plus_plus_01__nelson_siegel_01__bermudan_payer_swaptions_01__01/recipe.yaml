schema_version: 1
kind: prices
dataset_id: g2_plus_plus_01__nelson_siegel_01__bermudan_payer_swaptions_01__01
generator: catalog/model/fixed_income/g2_plus_plus/prices/nelson_siegel/bermudan_payer_swaptions/g2_plus_plus_01__nelson_siegel_01__bermudan_payer_swaptions_01__01/generator.cpp
inputs:
  model: datasets/model/fixed_income/g2_plus_plus/parameters/g2_plus_plus_01.json
  product: datasets/product/bermudan_swaption/bermudan_swaptions_01.json
  curve: datasets/curve/nelson_siegel/nelson_siegel_01.json
output:
  path: datasets/model/fixed_income/g2_plus_plus/prices/nelson_siegel/bermudan_payer_swaptions/g2_plus_plus_01__nelson_siegel_01__bermudan_payer_swaptions_01__01.json
  format: json
row_count: 1000
paths_per_price: 1048576
quote_convention:
  strike:
    mode: additive_to_initial_first_exercise_par_swap_rate
    unit: annualized_decimal_rate
    effective_level: strike = initial_first_exercise_par_swap_rate + strike_spread
  reference_policy: Resolved at the unbumped model and initial curve; absolute contract
    levels stay fixed for model and curve bumps.
row_selection:
  method: resolved_rate_strike_above_minimum
  minimum_annualized_decimal_rate: 1.0e-05
  reference: initial_unbumped_model_and_curve
  order: stable_candidate_index
option_side: payer
numerical_method:
  engine: fixed_income_lsm
  algorithm: longstaff_schwartz
  regression:
    basis: hermite_probabilists_two_factor_quadratic_6_term
    feature_normalization: central_lsm_row
    solver: ridge_regularized_fp64_normal_equations_cholesky
    refinement: none
exercise_replay: frozen_regression_policy
standard_error_scope: paired path dispersion conditional on the central in-sample
  LSM fit; excludes fit variability, policy bias, stencil bias and discretization
  bias
fit_and_valuation_paths: same paths
seeds:
  dynamics: 11668829074058379264
random_number_generator: philox
time_grid:
  steps_per_year: 504
  simulation_steps_per_day: 2
  delta_t: 1 / 504
internal_sensitivity_plan:
  method: finite_difference_shared_innovations
  parameters:
  - parameter: model.mean_reversion_x
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.volatility_x
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.mean_reversion_y
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.volatility_y
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.correlation
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: curve.beta0
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: curve.beta1
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: curve.beta2
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: curve.tau
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: product.strike
    displacement: 3.125e-05
    scale: absolute
    boundary: central_then_one_sided_order2
  bump_rule: h = displacement (absolute) or displacement * abs(x) (relative); centered
    when valid, otherwise second-order one-sided.
central_price_engine:
  gradient_dataset_id: g2_plus_plus_01__nelson_siegel_01__bermudan_payer_swaptions_01__01_price_gradient_frozen_policy
  output_channels:
  - price
  - standard_error
  calculation: identical central evaluation, candidate rows, seeds and replay as the
    first-order price-gradient generator
