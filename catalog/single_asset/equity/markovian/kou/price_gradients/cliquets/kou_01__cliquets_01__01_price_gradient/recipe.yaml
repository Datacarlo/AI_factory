schema_version: 1
kind: price_gradients
dataset_id: kou_01__cliquets_01__01_price_gradient
generator: catalog/single_asset/equity/markovian/kou/price_gradients/cliquets/kou_01__cliquets_01__01_price_gradient/generator.cpp
inputs:
  model: datasets/parameters/model/equity/markovian/kou/parameters/kou_01.json
  product: datasets/parameters/product/cliquet/cliquets_01.json
output:
  path: datasets/single_asset/equity/markovian/kou/price_gradients/cliquets/kou_01__cliquets_01__01_price_gradient.json
  format: json
row_layout: inline_parameters
row_count: 1000
time_representation:
  kind: exact_schedule_transition
  contractual_days_per_year: 252
  maturity_bump_steps_per_year: 504
paths_per_price: 1048576
random_number_generator: philox
seeds:
  dynamics: 11668827295941918720
sensitivity:
  method: finite_difference_shared_innovations
  bump_rule: h = displacement (absolute) or displacement * abs(x) (relative); centered
    when valid, otherwise second-order one-sided.
  parameters:
  - parameter: model.volatility
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.jump_intensity
    displacement: 0.05
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.up_probability
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.risk_free_rate
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.dividend_yield
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.positive_jump_rate
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.negative_jump_rate
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: product.participation_rate
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: product.local_floor
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: product.local_cap
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: product.global_floor
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: product.global_cap
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: product.maturity_years
    displacement: 0.001984126984126984
    scale: absolute
    boundary: central_then_one_sided_order2
  spot_contract_rule: Spot bumps keep absolute strikes and barriers resolved at the
    central spot fixed; product gradients use quoted ratios.
sensitivity_strategy: mono
standard_error_scope: paired Monte Carlo sampling error; excludes bump and discretization
  bias
payoff:
  periodic_return: R_i = S(t_i) / S(t_{i-1}) - 1; R_i = 0 when both spots are zero. The first loss into zero is retained. Local bounds apply afterwards.
