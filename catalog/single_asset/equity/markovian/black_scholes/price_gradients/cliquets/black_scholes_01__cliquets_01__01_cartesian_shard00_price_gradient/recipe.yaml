schema_version: 1
kind: price_gradients
dataset_id: black_scholes_01__cliquets_01__01_cartesian_shard00_price_gradient
generator: catalog/single_asset/equity/markovian/black_scholes/price_gradients/cliquets/black_scholes_01__cliquets_01__01_cartesian_shard00_price_gradient/generator.cpp
inputs:
  model: datasets/parameters/model/equity/markovian/black_scholes/parameters/black_scholes_01.json
  product: datasets/parameters/product/cliquet/cliquets_01_shard00.json
output:
  path: datasets/single_asset/equity/markovian/black_scholes/price_gradients/cliquets/black_scholes_01__cliquets_01__01_cartesian_shard00_price_gradient.json
  format: json
row_layout: inline_parameters
row_count: 100000
product_shard:
  index: 0
  total_shards: 10
  source_dataset: datasets/parameters/product/cliquet/cliquets_01.json
  selection: one seeded permutation position per contiguous ten-row block
  core_products: 90
  stress_products: 10
quote_convention:
  periodic_return:
    mode: S(t_i)/S(t_{i-1}) - 1
    unit: dimensionless
  local_floor:
    mode: periodic_return_bound
    unit: dimensionless
  local_cap:
    mode: periodic_return_bound
    unit: dimensionless
  global_floor:
    mode: cumulative_return_bound
    unit: dimensionless
  global_cap:
    mode: cumulative_return_bound
    unit: dimensionless
time_representation:
  kind: exact_schedule_transition
  contractual_days_per_year: 252
  maturity_bump_steps_per_year: 504
paths_per_price: 1048576
random_number_generator: philox
seeds:
  dynamics: 11668826797725712384
sensitivity:
  method: finite_difference_shared_innovations
  bump_rule: h = displacement (absolute) or displacement * abs(x) (relative); centered
    when valid, otherwise second-order one-sided.
  parameters:
  - parameter: model.volatility
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.risk_free_rate
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.dividend_yield
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: product.participation_rate
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: product.local_floor
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: product.local_cap
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: product.global_floor
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: product.global_cap
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: product.maturity_years
    displacement: 0.001984126984126984
    scale: absolute
    boundary: central_then_one_sided_order2
  spot_contract_rule: Spot bumps keep absolute strikes and barriers resolved at the
    central spot fixed; product gradients use quoted ratios.
sensitivity_strategy: mono
standard_error_scope: paired Monte Carlo sampling error; excludes bump and discretization
  bias
payoff:
  periodic_return: R_i = S(t_i) / S(t_{i-1}) - 1; R_i = 0 when both spots are zero. The first loss into zero is retained. Local bounds apply afterwards.
