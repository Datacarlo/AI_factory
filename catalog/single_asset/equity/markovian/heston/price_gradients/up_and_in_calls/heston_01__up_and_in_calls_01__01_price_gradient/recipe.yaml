schema_version: 1
kind: price_gradients
dataset_id: heston_01__up_and_in_calls_01__01_price_gradient
option_side: call
generator: catalog/single_asset/equity/markovian/heston/price_gradients/up_and_in_calls/heston_01__up_and_in_calls_01__01_price_gradient/generator.cpp
inputs:
  model: datasets/parameters/model/equity/markovian/heston/parameters/heston_01.json
  product: datasets/parameters/product/up_and_in_option/up_and_in_options_01.json
output:
  path: datasets/single_asset/equity/markovian/heston/price_gradients/up_and_in_calls/heston_01__up_and_in_calls_01__01_price_gradient.json
  format: json
row_layout: inline_parameters
row_count: 1000
time_grid:
  steps_per_year: 504
  simulation_steps_per_day: 2
  delta_t: 1 / 504
paths_per_price: 1048576
random_number_generator: philox
seeds:
  dynamics: 11668827106963357696
sensitivity:
  method: finite_difference_shared_innovations
  bump_rule: h = displacement (absolute) or displacement * abs(x) (relative); centered
    when valid, otherwise second-order one-sided.
  parameters:
  - parameter: model.spot
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.initial_variance
    displacement: 0.001
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.rho
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.risk_free_rate
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.dividend_yield
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.kappa
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.theta
    displacement: 0.001
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.gamma
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: product.strike
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: product.barrier
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: product.maturity_years
    displacement: 0.001984126984126984
    scale: absolute
    boundary: central_then_one_sided_order2
  spot_contract_rule: Spot bumps keep absolute strikes and barriers resolved at the
    central spot fixed; product gradients use quoted ratios.
sensitivity_strategy: mono
standard_error_scope: paired Monte Carlo sampling error; excludes bump and discretization
  bias
