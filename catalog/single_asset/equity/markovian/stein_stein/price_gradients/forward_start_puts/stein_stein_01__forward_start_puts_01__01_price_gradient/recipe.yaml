schema_version: 1
kind: price_gradients
dataset_id: stein_stein_01__forward_start_puts_01__01_price_gradient
option_side: put
generator: catalog/single_asset/equity/markovian/stein_stein/price_gradients/forward_start_puts/stein_stein_01__forward_start_puts_01__01_price_gradient/generator.cpp
inputs:
  model: datasets/parameters/model/equity/markovian/stein_stein/parameters/stein_stein_01.json
  product: datasets/parameters/product/forward_start_option/forward_start_options_01.json
output:
  path: datasets/single_asset/equity/markovian/stein_stein/price_gradients/forward_start_puts/stein_stein_01__forward_start_puts_01__01_price_gradient.json
  format: json
row_layout: inline_parameters
row_count: 1000
time_grid:
  steps_per_year: 504
  simulation_steps_per_day: 2
  delta_t: 1 / 504
paths_per_price: 1048576
random_number_generator: philox
seeds:
  dynamics: 11668828030381326336
sensitivity:
  method: finite_difference_shared_innovations
  bump_rule: h = displacement (absolute) or displacement * abs(x) (relative); centered
    when valid, otherwise second-order one-sided.
  parameters:
  - parameter: model.initial_volatility
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.rho
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.risk_free_rate
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.dividend_yield
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: model.mean_reversion
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.volatility_of_volatility
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: product.moneyness
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: product.maturity_years
    displacement: 0.001984126984126984
    scale: absolute
    boundary: central_then_one_sided_order2
  reconstructible_from_price:
  - parameter: model.spot
    formula: price / model.spot
    standard_error: standard_error / model.spot
  spot_contract_rule: Spot bumps keep absolute strikes and barriers resolved at the
    central spot fixed; product gradients use quoted ratios.
sensitivity_strategy: mono
standard_error_scope: paired Monte Carlo sampling error; excludes bump and discretization
  bias
