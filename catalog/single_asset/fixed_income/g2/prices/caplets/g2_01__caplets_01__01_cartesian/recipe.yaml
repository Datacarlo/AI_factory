schema_version: 1
kind: prices
dataset_id: g2_01__caplets_01__01_cartesian
option_side: call
generator: catalog/single_asset/fixed_income/g2/prices/caplets/g2_01__caplets_01__01_cartesian/generator.cpp
inputs:
  model: datasets/parameters/model/fixed_income/g2/parameters/g2_01.json
  product: datasets/parameters/product/rate_option/rate_options_01.json
output:
  path: datasets/single_asset/fixed_income/g2/prices/caplets/g2_01__caplets_01__01_cartesian.json
  format: json
row_layout: inline_parameters
candidate_row_count: 1000000
row_selection:
  method: resolved_rate_strike_above_minimum
  minimum_annualized_decimal_rate: 1.0e-05
  reference: initial_unbumped_model_and_curve
  order: stable_candidate_index
quote_convention:
  strike:
    mode: additive_to_initial_simple_forward_rate
    unit: annualized_decimal_rate
    effective_level: strike = initial_simple_forward_rate + strike_spread
central_price_engine:
  gradient_dataset_id: g2_01__caplets_01__01_cartesian_price_gradient
  output_channels:
  - price
  calculation: identical central evaluation, candidate rows and seeds as the price-gradient
    generator; no sensitivity nodes or gradient replay
time_representation:
  kind: exact_terminal_transition
  contractual_days_per_year: 252
paths_per_price: 0
