schema_version: 1
kind: prices
dataset_id: g2_01__bermudan_receiver_swaptions_01__01
option_side: receiver
generator: catalog/single_asset/fixed_income/g2/prices/bermudan_receiver_swaptions/g2_01__bermudan_receiver_swaptions_01__01/generator.cpp
inputs:
  model: datasets/parameters/model/fixed_income/g2/parameters/g2_01.json
  product: datasets/parameters/product/bermudan_swaption/bermudan_swaptions_01.json
output:
  path: datasets/single_asset/fixed_income/g2/prices/bermudan_receiver_swaptions/g2_01__bermudan_receiver_swaptions_01__01.json
  format: json
row_layout: inline_parameters
candidate_row_count: 1000
row_selection:
  method: resolved_rate_strike_above_minimum
  minimum_annualized_decimal_rate: 1.0e-05
  reference: initial_unbumped_model_and_curve
  order: stable_candidate_index
quote_convention:
  strike:
    mode: additive_to_initial_first_exercise_par_swap_rate
    unit: annualized_decimal_rate
    effective_level: strike = initial_first_exercise_par_swap_rate + strike_spread
numerical_method:
  engine: fixed_income_lsm
  algorithm: longstaff_schwartz
  regression:
    basis: hermite_probabilists_two_factor_quadratic_6_term
    feature_normalization: central_lsm_row
    solver: ridge_regularized_fp64_normal_equations_cholesky
    refinement: none
central_price_engine:
  gradient_dataset_id: g2_01__bermudan_receiver_swaptions_01__01_price_gradient_frozen_policy
  output_channels:
  - price
  - standard_error
  calculation: identical central evaluation, candidate rows and seeds as the price-gradient
    generator; no sensitivity nodes or gradient replay
time_grid:
  steps_per_year: 504
  simulation_steps_per_day: 2
  delta_t: 1 / 504
paths_per_price: 1048576
random_number_generator: philox
seeds:
  dynamics: 11668829061173477376
fit_and_valuation_paths: same paths
standard_error_scope: path dispersion conditional on the central in-sample LSM fit;
  excludes fit variability, policy bias and discretization bias
