schema_version: 1
kind: price_gradients
dataset_id: g2_plus_plus_01__flat_01__bermudan_payer_swaptions_01__01_cartesian_shard00_price_gradient_frozen_policy
option_side: payer
generator: catalog/single_asset/fixed_income/g2_plus_plus/price_gradients/flat/bermudan_payer_swaptions/g2_plus_plus_01__flat_01__bermudan_payer_swaptions_01__01_cartesian_shard00_price_gradient_frozen_policy/generator.cpp
inputs:
  model: datasets/parameters/model/fixed_income/g2_plus_plus/parameters/g2_plus_plus_01.json
  product: datasets/parameters/product/bermudan_swaption/bermudan_swaptions_01_shard00.json
  curve: datasets/parameters/curve/flat/flat_01.json
output:
  path: datasets/single_asset/fixed_income/g2_plus_plus/price_gradients/flat/bermudan_payer_swaptions/g2_plus_plus_01__flat_01__bermudan_payer_swaptions_01__01_cartesian_shard00_price_gradient_frozen_policy.json
  format: json
row_layout: inline_parameters
candidate_row_count: 100000
product_shard:
  index: 0
  total_shards: 10
  source_dataset: datasets/parameters/product/bermudan_swaption/bermudan_swaptions_01.json
  selection: one seeded permutation position per contiguous ten-row block
  core_products: 90
  stress_products: 10
curve_assignment:
  method: splitmix64_modulo
  seed: 20261014
  sampling: with_replacement
  key: zero_based_result_index
row_selection:
  method: resolved_rate_strike_above_minimum
  minimum_annualized_decimal_rate: 1.0e-05
  reference: initial_unbumped_model_and_curve
  order: stable_candidate_index
quote_convention:
  strike:
    mode: additive_to_initial_first_exercise_par_swap_rate
    unit: annualized_decimal_rate
    effective_level: strike = initial_first_exercise_par_swap_rate + strike_spread
numerical_method:
  engine: fixed_income_lsm
  algorithm: longstaff_schwartz
  regression:
    basis: hermite_probabilists_two_factor_quadratic_6_term
    feature_normalization: central_lsm_row
    solver: ridge_regularized_fp64_normal_equations_cholesky
    refinement: none
time_grid:
  steps_per_year: 504
  simulation_steps_per_day: 2
  delta_t: 1 / 504
paths_per_price: 1048576
random_number_generator: philox
seeds:
  dynamics: 11668829220087267328
sensitivity:
  method: finite_difference_shared_innovations
  bump_rule: h = displacement (absolute) or displacement * abs(x) (relative); centered
    when valid, otherwise second-order one-sided.
  parameters:
  - parameter: model.mean_reversion_x
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.volatility_x
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.mean_reversion_y
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.volatility_y
    displacement: 0.005
    scale: relative
    boundary: central_then_one_sided_order2
  - parameter: model.correlation
    displacement: 0.002
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: curve.rate
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
  - parameter: product.strike
    displacement: 0.0005
    scale: absolute
    boundary: central_then_one_sided_order2
exercise_replay: frozen_regression_policy
fit_and_valuation_paths: same paths
standard_error_scope: paired path dispersion conditional on the central in-sample
  LSM fit; excludes fit variability, policy bias, stencil bias and discretization
  bias
