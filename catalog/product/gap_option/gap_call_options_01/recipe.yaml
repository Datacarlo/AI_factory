schema_version: 1
kind: product_parameters
dataset_id: gap_call_options_01
generator: catalog/product/gap_option/gap_call_options_01/generator.cpp
output:
  path: datasets/product/gap_option/gap_call_options_01.json
  format: json
product_family: Gap Calls
row_count: 1000
time_convention:
  unit: business_day
  days_per_year: 252
quote_convention:
  trigger_strike:
    mode: ratio_to_central_spot
    unit: dimensionless
    effective_level: trigger_strike * S0
  payoff_strike:
    mode: ratio_to_central_spot
    unit: dimensionless
    effective_level: payoff_strike * S0
  reference_policy: Resolved at the unbumped model spot S0 for each model-product
    pair; absolute contract levels remain fixed for model bumps.
parameters:
  trigger_strike: Dimensionless ratio of the quoted spot level to the central model
    spot S0; 1.0 means 100% of S0.
  payoff_strike: Dimensionless ratio of the quoted spot level to the central model
    spot S0; 1.0 means 100% of S0.
  maturity: Maturity in business days.
payoff:
  expression: (S_T - payoff_strike) * 1{S_T > trigger_strike}
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: maturity-dependent exponential grid
      rule: For each T in business days, x is linearly spaced on [-aT/252, aT/252]
        and K = exp(x).
      grid:
        maturity:
          minimum: 21
          maximum: 756
          count: 45
          spacing: linear
        strike:
          count_per_maturity: 20
          spacing: linear in log-strike
          conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
          a: 0.2
  stress:
    row_count: 100
    generation:
      method: maturity-dependent exponential grid
      rule: For each T in business days, x is linearly spaced on [-aT/252, aT/252]
        and K = exp(x).
      grid:
        maturity:
          minimum: 5
          maximum: 1260
          count: 10
          spacing: linear
        strike:
          count_per_maturity: 10
          spacing: linear in log-strike
          conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
          a: 0.2
  grid:
    maturity:
      core:
        minimum: 21
        maximum: 756
        count: 45
        spacing: linear
      stress:
        minimum: 5
        maximum: 1260
        count: 10
        spacing: linear
    trigger_strike:
      core:
        count_per_maturity: 20
        conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
        a: 0.2
      stress:
        count_per_maturity: 10
        conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
        a: 0.2
      spacing: linear in log-strike
  payoff_strike:
    rule: trigger_strike * exp(-0.05 * sqrt((T / 252) / 3))
