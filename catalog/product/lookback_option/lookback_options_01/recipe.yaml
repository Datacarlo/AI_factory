schema_version: 1
kind: product_parameters
dataset_id: lookback_options_01
generator: catalog/product/lookback_option/lookback_options_01/generator.cpp
output:
  path: datasets/product/lookback_option/lookback_options_01.json
  format: json
product_family: Fixed-Strike Lookback Calls
row_count: 1000
time_convention:
  unit: business_day
  days_per_year: 252
quote_convention:
  strike:
    mode: ratio_to_central_spot
    unit: dimensionless
    effective_level: strike * S0
  reference_policy: Resolved at the unbumped model spot S0 for each model-product
    pair; absolute contract levels remain fixed for model bumps.
parameters:
  strike: Dimensionless ratio of the quoted spot level to the central model spot S0;
    1.0 means 100% of S0.
  maturity: Maturity in business days.
payoff:
  expression: max(maximum(S_[0,T]) - K, 0)
  monitoring: Simulation-grid endpoints including 0 and T.
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: maturity-dependent exponential grid
      rule: For each T in business days, x is linearly spaced on [-aT/252, aT/252]
        and K = exp(x).
      grid:
        maturity:
          minimum: 21
          maximum: 756
          count: 45
          spacing: linear
        strike:
          count_per_maturity: 20
          spacing: linear in log-strike
          conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
          a: 0.25
  stress:
    row_count: 100
    generation:
      method: maturity-dependent exponential grid
      rule: For each T in business days, x is linearly spaced on [-aT/252, aT/252]
        and K = exp(x).
      grid:
        maturity:
          minimum: 5
          maximum: 1260
          count: 10
          spacing: linear
        strike:
          count_per_maturity: 10
          spacing: linear in log-strike
          conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
          a: 0.25
  grid:
    maturity:
      core:
        minimum: 21
        maximum: 756
        count: 45
        spacing: linear
      stress:
        minimum: 5
        maximum: 1260
        count: 10
        spacing: linear
    strike:
      core:
        count_per_maturity: 20
        conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
        a: 0.25
      stress:
        count_per_maturity: 10
        conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
        a: 0.25
      spacing: linear in log-strike
