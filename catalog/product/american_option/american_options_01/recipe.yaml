schema_version: 1
kind: product_parameters
dataset_id: american_options_01
generator: catalog/product/american_option/american_options_01/generator.cpp
output:
  path: datasets/product/american_option/american_options_01.json
  format: json
product_family: American Options
row_count: 1000
time_convention:
  unit: business_day
  days_per_year: 252
quote_convention:
  strike:
    mode: ratio_to_central_spot
    unit: dimensionless
    effective_level: strike * S0
  reference_policy: Resolved at the unbumped model spot S0 for each model-product
    pair; absolute contract levels remain fixed for model bumps.
parameters:
  strike: Dimensionless ratio of the quoted spot level to the central model spot S0;
    1.0 means 100% of S0.
  maturity: Maturity in business days.
  exercise_interval: Business days between exercise dates.
payoff:
  expression: max(side * (S_t - K), 0) at each exercise date; side = +1 call / -1
    put
  interpretation: Continuous American exercise is approximated on discrete dates.
construction:
  method: ordered 90/10 core-stress construction
  row_order:
    core: rows 1-900
    stress: rows 901-1000
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: maturity-dependent exponential grid
      rule: For each T in business days, x is linearly spaced on [-aT/252, aT/252]
        and K = exp(x).
      grid:
        maturity:
          minimum: 21
          maximum: 756
          count: 45
          spacing: linear
        strike:
          count_per_maturity: 20
          spacing: linear in log-strike
          conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
          a: 0.2
  stress:
    row_count: 100
    generation:
      method: maturity-dependent exponential grid
      rule: For each T in business days, x is linearly spaced on [-aT/252, aT/252]
        and K = exp(x).
      grid:
        maturity:
          minimum: 10
          maximum: 1260
          count: 10
          spacing: linear
        strike:
          count_per_maturity: 10
          spacing: linear in log-strike
          conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
          a: 0.2
  grid:
    maturity:
      core:
        minimum: 21
        maximum: 756
        count: 45
        spacing: linear
      stress:
        minimum: 10
        maximum: 1260
        count: 10
        spacing: linear
    strike:
      core:
        count_per_maturity: 20
        conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
        a: 0.2
      stress:
        count_per_maturity: 10
        conditional_bounds: '[exp(-aT/252), exp(aT/252)]'
        a: 0.2
      spacing: linear in log-strike
  exercise_interval_sampling:
    method: uniform sample among feasible conventions
    conventions:
    - 21 business days (monthly)
    - 10 business days (semi-monthly)
    - 5 business days (weekly)
    exercise_dates: maturity - n * exercise_interval, ..., maturity
    constraint: 1 * exercise_interval < maturity
    minimum_exercise_dates: 2
